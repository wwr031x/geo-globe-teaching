name: sync14
on:
  push:
    paths:
      - '.github/workflows/sync14.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -A 'Mozilla/5.0' --fail --retry 5 -o index.html 'https://aka.doubaocdn.com/s/z87s70FKKU'
          curl -sSL -A 'Mozilla/5.0' --fail --retry 5 -o app.bundle.js 'https://aka.doubaocdn.com/s/sgrCWqHhEX'
          ls -l index.html app.bundle.js
      - name: commit
        run: |
          git config user.name 'sync-bot'
          git config user.email 'sync-bot@users.noreply.github.com'
          git add index.html app.bundle.js
          git commit -m 'deploy: thin-layer picking + label cull v20' || echo none
          git push
