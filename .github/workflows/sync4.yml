name: sync4
on:
  push:
    paths:
      - '.github/workflows/sync4.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -A 'Mozilla/5.0' --fail --retry 5 --retry-delay 2 -o index.html 'https://aka.doubaocdn.com/s/rmeEDaEbUl'
          ls -l index.html
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'fix: mobile legend layout' || echo 'nothing to commit'
          git push
