name: sync28
on:
  push:
    paths:
      - '.github/workflows/sync28.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch artifacts
        run: |
          curl -sSL -A 'Mozilla/5.0' --fail --retry 5 -o index.html 'https://aka.doubaocdn.com/s/AwnZYkM7sV'
      - name: commit
        run: |
          git config user.name 'sync-bot'
          git config user.email 'sync@local'
          git add index.html
          git commit -m 'chore: v28 ui polish' || true
          git push
