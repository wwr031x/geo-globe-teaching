name: sync25
on:
  push:
    paths:
      - '.github/workflows/sync25.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -A 'Mozilla/5.0' --fail --retry 5 https://aka.doubaocdn.com/s/iD6LV50Xxv -o app.bundle.js
          curl -sSL -A 'Mozilla/5.0' --fail --retry 5 https://aka.doubaocdn.com/s/YpkpT5dVfk -o index.html
          md5sum app.bundle.js index.html
      - name: commit
        run: |
          git config user.name wwr031x
          git config user.email wwr031x@users.noreply.github.com
          git add app.bundle.js index.html
          git commit -m 'deploy: 4k shaded relief earth v25' || echo nothing
          git push
