name: sync-index
on:
  push:
    paths:
      - .github/workflows/sync-index.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch page and minified three
        run: |
          mkdir -p vendor
          curl -fsSL "https://aka.doubaocdn.com/s/FdKyrUVVU7" -o index.html
          curl -fsSL "https://aka.doubaocdn.com/s/A6lHKUAC6G" -o vendor/three.module.js
          ls -l index.html vendor
      - name: Commit and push
        run: |
          git config user.name "terra-sync-bot"
          git config user.email "terra-sync-bot@users.noreply.github.com"
          git add -A index.html vendor
          if git diff --cached --quiet; then echo "no change"; else git commit -m "perf: minified three, lit first frame, no mobile intro swoop" && git push; fi
