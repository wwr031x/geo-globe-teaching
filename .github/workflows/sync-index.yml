name: sync-assets
on:
  push:
    paths:
      - '.github/workflows/sync-index.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -L --fail --retry 3 -o index.html "https://aka.doubaocdn.com/s/HRbwCtS9SM"
          curl -L --fail --retry 3 -o app.bundle.js "https://aka.doubaocdn.com/s/fp0Ibp9g89"
          ls -l index.html app.bundle.js
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html app.bundle.js
          git commit -m "feat: mountain layer, mini 3D models, arc flight, richer KB" || echo "nothing to commit"
          git push
