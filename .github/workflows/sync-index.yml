name: sync-assets
on:
  push:
    paths:
      - '.github/workflows/sync-index.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -L --fail --retry 3 -o index.html "https://aka.doubaocdn.com/s/48goqRMQFd"
          ls -l index.html
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m "sync: index cache-bust v8" || echo "nothing to commit"
          git push
