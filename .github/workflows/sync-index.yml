name: sync-index
on:
  push:
    paths:
      - .github/workflows/sync-index.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch page
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/8ubt5hpHb2" -o index.html
          ls -l index.html
          grep -c modulepreload index.html || true
      - name: Commit and push
        run: |
          git config user.name "terra-sync-bot"
          git config user.email "terra-sync-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "no change"; else git commit -m "perf: preload three/gsap/纹理域名预连接" && git push; fi
