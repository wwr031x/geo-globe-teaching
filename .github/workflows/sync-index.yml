name: sync-index
on:
  push:
    paths:
      - .github/workflows/sync-index.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch page and bundle
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/szRfirNjiG" -o index.html
          curl -fsSL "https://aka.doubaocdn.com/s/UVp5SUFtAQ" -o app.bundle.js
          ls -l index.html app.bundle.js
      - name: Commit and push
        run: |
          git config user.name "terra-sync-bot"
          git config user.email "terra-sync-bot@users.noreply.github.com"
          git add -A index.html app.bundle.js
          if git diff --cached --quiet; then echo "no change"; else git commit -m "perf: single bundled app, no importmap, failover boot" && git push; fi
