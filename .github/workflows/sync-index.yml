name: sync-index
on:
  push:
    paths:
      - .github/workflows/sync-index.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch built page
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/U5Mi2BSRsO" -o index.html
          ls -l index.html
      - name: Commit and push
        run: |
          git config user.name "terra-sync-bot"
          git config user.email "terra-sync-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "no change"; else git commit -m "fix(ui): keep sun overview visible across earth layers; add adjustment HUD" && git push; fi
