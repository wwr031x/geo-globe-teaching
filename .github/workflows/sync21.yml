name: sync21
on:
  push:
    paths:
      - '.github/workflows/sync21.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch assets
        run: |
          curl -sSL -A 'Mozilla/5.0' --fail --retry 5 -o index.html 'https://aka.doubaocdn.com/s/n1Ulykwh73'
          curl -sSL -A 'Mozilla/5.0' --fail --retry 5 -o app.bundle.js 'https://aka.doubaocdn.com/s/DxI85DDCcO'
          ls -l index.html app.bundle.js
      - name: commit
        run: |
          git config user.name 'sync-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add index.html app.bundle.js
          git commit -m 'deploy: v21 ridge glow' || echo 'no change'
          git push
