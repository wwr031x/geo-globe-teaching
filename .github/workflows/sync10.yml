name: sync10
on:
  push:
    paths:
      - '.github/workflows/sync10.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch index
        run: curl -sSL -A 'Mozilla/5.0' --fail --retry 5 -o index.html 'https://aka.doubaocdn.com/s/7xA3sbnnaS'
      - name: fetch bundle
        run: curl -sSL -A 'Mozilla/5.0' --fail --retry 5 -o app.bundle.js 'https://aka.doubaocdn.com/s/LZlMdgTzDS'
      - name: commit
        run: |
          git config user.name 'sync-bot'
          git config user.email 'sync@bot.local'
          git add -A
          git commit -m 'sync 10: solar view framing, plasma sun, gallery polish' || echo 'no change'
          git push
