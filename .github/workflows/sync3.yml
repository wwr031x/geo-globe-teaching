name: sync3
on:
  push:
    paths:
      - '.github/workflows/sync3.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -A 'Mozilla/5.0' --fail --retry 5 --retry-delay 2 -o index.html 'https://aka.doubaocdn.com/s/GkuFs0MVQ3'
          curl -sSL -A 'Mozilla/5.0' --fail --retry 5 --retry-delay 2 -o app.bundle.js 'https://aka.doubaocdn.com/s/6lnj6Ar4KX'
          ls -l index.html app.bundle.js
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html app.bundle.js
          git commit -m 'feat: even-lit earth, 3D sun, 3D interior shells, HTML legend' || echo 'nothing to commit'
          git push
