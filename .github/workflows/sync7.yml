name: sync7
on:
  push:
    paths:
      - '.github/workflows/sync7.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -A 'Mozilla/5.0' --fail --retry 5 --retry-delay 2 -o index.html 'https://aka.doubaocdn.com/s/y79xLD5fpw'
          curl -sSL -A 'Mozilla/5.0' --fail --retry 5 --retry-delay 2 -o app.bundle.js 'https://aka.doubaocdn.com/s/dnNAucF2HP'
          ls -l index.html app.bundle.js
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html app.bundle.js
          git commit -m 'polish: stone/lawn materials' || echo 'nothing to commit'
          git push
