name: sync27
on:
  push:
    paths:
      - '.github/workflows/sync27.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch artifacts
        run: |
          curl -sSL -A 'Mozilla/5.0' --fail --retry 5 -o app.bundle.js 'https://aka.doubaocdn.com/s/XvDFHeTgKC'
          curl -sSL -A 'Mozilla/5.0' --fail --retry 5 -o index.html 'https://aka.doubaocdn.com/s/9L9vR1eGjV'
      - name: commit
        run: |
          git config user.name 'sync-bot'
          git config user.email 'sync@local'
          git add app.bundle.js index.html
          git commit -m 'chore: v27 dual surface styles' || true
          git push
