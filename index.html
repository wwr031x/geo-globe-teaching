<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地球研习所 · 交互式地理学习地球仪</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23071019' stroke='%2338d6bb' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='7' ry='14' fill='none' stroke='%2338d6bb' stroke-width='1.4'/%3E%3Cpath d='M3 16h26M5 9h22M5 23h22' stroke='%2338d6bb' stroke-width='1.2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="preconnect" href="https://media.doubao.com" crossorigin>
<link rel="dns-prefetch" href="https://media.doubao.com">
<link rel="preload" as="image" crossorigin href="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/Jo69bwpqAob08hxxnZdcVAEansf">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#04070d; --panel:rgba(9,16,26,.86); --panel-solid:#0a121d;
  --line:rgba(132,172,206,.16); --line-strong:rgba(132,172,205,.32);
  --text:#e7eff6; --muted:#8ba0b5; --faint:#5d7186;
  --teal:#38d6bb; --teal-dim:rgba(56,214,187,.14);
  --amber:#e6b25f; --warm:#ff7a4d; --cold:#53b7e8;
  --font-display:'Space Grotesk','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
  --font-body:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC','Space Grotesk',sans-serif;
  --dock-h:54px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--font-body);-webkit-font-smoothing:antialiased;font-size:14px}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
::selection{background:rgba(56,214,187,.3)}
#canvasHost{position:fixed;inset:0;z-index:0}
#canvasHost canvas{display:block;cursor:grab;touch-action:none}
#canvasHost canvas:active{cursor:grabbing}

/* ============ 加载屏 ============ */
#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .7s ease}
#loader.done{opacity:0;pointer-events:none}
.loader-ring{width:64px;height:64px;border-radius:50%;border:2px solid rgba(56,214,187,.18);
  border-top-color:var(--teal);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-title{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:.12em}
.loader-sub{color:var(--muted);font-size:13px;min-height:18px}
.loader-bar{width:200px;height:2px;background:rgba(132,172,206,.15);border-radius:2px;overflow:hidden}
.loader-bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .4s ease}

/* ============ 通用框架 ============ */
#app{position:fixed;inset:0;z-index:10;pointer-events:none}
#app .interactive{pointer-events:auto}
.topbar{position:absolute;top:0;left:0;right:0;height:58px;display:flex;align-items:center;
  gap:14px;padding:0 16px;
  background:linear-gradient(to bottom,rgba(4,7,13,.85),rgba(4,7,13,0))}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand svg{width:30px;height:30px}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-txt b{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.06em}
.brand-txt small{font-family:var(--font-display);font-size:9.5px;color:var(--teal);letter-spacing:.24em}

/* 搜索 */
.search{position:relative;flex:1;max-width:340px;margin:0 auto}
.search input{width:100%;height:38px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);padding:0 38px 0 36px;color:var(--text);font-size:13.5px;outline:none;
  transition:border-color .25s,background .25s}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--teal);background:var(--panel-solid)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;
  border-radius:6px;display:none;align-items:center;justify-content:center;color:var(--muted)}
.search .clear:hover{color:var(--text);background:rgba(255,255,255,.06)}
.search.has-val .clear{display:flex}
.search-results{position:absolute;top:44px;left:0;right:0;background:var(--panel-solid);
  border:1px solid var(--line-strong);border-radius:10px;max-height:320px;overflow-y:auto;
  display:none;box-shadow:0 18px 44px rgba(0,0,0,.5)}
.search-results.open{display:block}
@media (max-width:767px){
  .search-results{position:fixed;left:12px;right:12px;top:58px;max-height:46vh}
  .search-results .sr-item{padding:12px 14px}
}
.sr-item{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left;
  border-bottom:1px solid var(--line)}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:rgba(56,214,187,.08)}
.sr-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sr-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-meta{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-kind{margin-left:auto;font-size:10.5px;color:var(--faint);font-family:var(--font-display);
  border:1px solid var(--line);border-radius:5px;padding:2px 6px;flex-shrink:0}

.top-actions{display:flex;gap:8px;flex-shrink:0}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .25s}
.icon-btn:hover{color:var(--text);border-color:var(--line-strong)}
.icon-btn.active{color:var(--teal);border-color:rgba(56,214,187,.5);background:var(--teal-dim)}
.icon-btn svg{width:17px;height:17px}

/* ============ 图层面板（移动端横向 chip） ============ */
.layer-panel{position:absolute;left:12px;right:12px;bottom:calc(var(--dock-h) + 14px);
  display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.layer-panel::-webkit-scrollbar{display:none}
.layer-btn{flex-shrink:0;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;
  border-radius:21px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  font-size:13px;transition:all .3s cubic-bezier(.22,1,.36,1)}
.layer-btn svg{width:16px;height:16px}
.layer-btn.active{color:#04121a;background:var(--teal);border-color:var(--teal);font-weight:600}
.layer-btn:not(.active):hover{color:var(--text);border-color:var(--line-strong)}

/* ============ 详情面板（移动端底部抽屉） ============ */
.detail-panel{position:absolute;left:0;right:0;bottom:0;max-height:62vh;background:var(--panel-solid);
  border-top:1px solid var(--line-strong);border-radius:18px 18px 0 0;
  transform:translateY(105%);transition:transform .45s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;box-shadow:0 -20px 50px rgba(0,0,0,.45)}
.detail-panel.open{transform:translateY(0)}
.detail-grab{width:38px;height:4px;border-radius:2px;background:var(--line-strong);margin:10px auto 4px;flex-shrink:0;touch-action:none;cursor:grab;position:relative}
.detail-grab::after{content:"";position:absolute;left:-60px;right:-60px;top:-12px;bottom:-14px}
.detail-panel.sheet-drag{transition:none!important}
.detail-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.detail-close:hover{background:rgba(255,255,255,.07);color:var(--text)}
.detail-body{padding:6px 20px 24px;overflow-y:auto;flex:1}

/* ============ 详情内容元素 ============ */
.dp-kicker{font-family:var(--font-display);font-size:11px;letter-spacing:.2em;color:var(--teal);
  text-transform:uppercase;margin-bottom:8px}
.dp-title{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.25}
.dp-sub{color:var(--muted);font-size:13px;margin-top:5px}
.dp-desc{font-size:13.5px;line-height:1.75;color:#c3d2df;margin-top:14px}
.dp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:16px}
.dp-photo{width:100%;height:168px;object-fit:cover;object-position:center;border-radius:12px;margin-top:14px;display:block;border:1px solid rgba(255,255,255,.08)}
.dp-cell{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:rgba(255,255,255,.02)}
.dp-cell .k{font-size:11.5px;color:var(--faint);margin-bottom:5px}
.dp-cell .v{font-size:15px;font-weight:600;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.dp-cell .v small{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
.dp-section-title{font-family:var(--font-display);font-size:12.5px;font-weight:600;color:var(--muted);
  margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.dp-section-title::before{content:"";width:14px;height:2px;background:var(--teal);border-radius:1px}
.dp-table{width:100%;border-collapse:collapse;font-size:12.5px}
.dp-table th{text-align:left;color:var(--faint);font-weight:500;font-size:11.5px;padding:7px 8px;
  border-bottom:1px solid var(--line)}
.dp-table td{padding:9px 8px;border-bottom:1px solid var(--line);color:#c3d2df;vertical-align:top}
.dp-table td.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.dp-table tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;font-family:var(--font-display)}
.tag.warm{color:var(--warm);background:rgba(255,122,77,.12);border:1px solid rgba(255,122,77,.3)}
.tag.cold{color:var(--cold);background:rgba(83,183,232,.12);border:1px solid rgba(83,183,232,.3)}
.tag.teal{color:var(--teal);background:var(--teal-dim);border:1px solid rgba(56,214,187,.3)}
.dp-note{font-size:11.5px;color:var(--faint);margin-top:14px;line-height:1.6;
  padding:10px 12px;border-left:2px solid var(--amber);background:rgba(230,178,95,.06);border-radius:0 8px 8px 0}
.dp-list{display:flex;flex-direction:column;gap:8px}
.dp-list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;font-size:13px;cursor:pointer;transition:all .2s;text-align:left;width:100%}
.dp-list-item:hover{border-color:var(--teal);background:var(--teal-dim)}
.dp-list-item.active{border-color:var(--teal);background:var(--teal-dim);box-shadow:inset 0 0 0 1px rgba(56,214,187,.35)}
.dp-list-item.active .nm{color:var(--teal);font-weight:600}
.dp-list-item .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dp-list-item .thumb{width:46px;height:35px;object-fit:cover;border-radius:7px;flex-shrink:0;
  border:1px solid rgba(255,255,255,.1)}
.dp-list-item .nm{font-weight:500;min-width:0}
.dp-list-item .meta{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--font-display)}
.solar-ctl{display:flex;align-items:center;gap:14px;margin-top:16px;padding:12px 14px;
  border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);flex-wrap:wrap}
.solar-play{height:34px;padding:0 16px;border-radius:9px;background:var(--teal-dim);
  border:1px solid var(--teal);color:var(--teal);font-size:13px;transition:all .25s}
.solar-play:hover{background:var(--teal);color:#04121a}
.solar-speed{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.solar-speed input{flex:1;accent-color:var(--teal);height:4px}
.solar-speed .sv{font-family:var(--font-display);color:var(--text);font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
.dp-layer-row{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;
  transition:all .25s}
.dp-layer-row:hover{border-color:var(--line-strong)}
.dp-layer-row.sel{border-color:var(--teal);background:var(--teal-dim)}
.dp-layer-head{display:flex;align-items:center;gap:10px}
.dp-layer-sw{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.dp-layer-name{font-family:var(--font-display);font-weight:600;font-size:14.5px}
.dp-layer-depth{margin-left:auto;font-size:11.5px;color:var(--muted);font-family:var(--font-display)}
.dp-layer-facts{display:none;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.dp-layer-row.sel .dp-layer-facts{display:grid}
.dp-layer-facts .dp-cell{padding:9px 10px}
.dp-layer-facts .v{font-size:13px}
.dp-layer-row.static{cursor:default}
.dp-layer-row.static:hover{border-color:var(--line)}
.wave-diagram{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.02);margin-top:10px}
.wave-diagram svg{display:block;width:100%;height:auto}

/* ============ 地震波独立板块 ============ */
.wv-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.wv-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#c3d2df;
  border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:rgba(255,255,255,.02)}
.wv-chip .sw{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.wv-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;background:rgba(255,255,255,.02)}
.wv-card-head{display:flex;align-items:center;gap:10px}
.wv-card-head .sw{width:13px;height:13px;border-radius:50%;flex-shrink:0}
.wv-card-head .nm{font-family:var(--font-display);font-weight:600;font-size:15px}
.wv-card-head .alias{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--font-display)}
.wv-facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.wv-fact{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:rgba(255,255,255,.02)}
.wv-fact .k{font-size:11px;color:var(--faint);margin-bottom:4px}
.wv-fact .v{font-size:13px;line-height:1.5;color:#dbe8f1}
.wv-fact .v b{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.wv-card .wv-desc{font-size:12.5px;line-height:1.7;color:var(--muted);margin-top:10px}
.wv-vib{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.wv-vib .box{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.02)}
.wv-vib .box .t{font-size:12px;font-weight:600;margin-bottom:6px}
.wv-vib svg{display:block;width:100%;height:auto}
.wv-seismo{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.02);margin-top:12px}
.wv-seismo svg{display:block;width:100%;height:auto}
.wv-evidence{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.wv-evidence .row{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:rgba(255,255,255,.02)}
.wv-evidence .row .badge{flex-shrink:0;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:12px;font-weight:700;color:#04121a}
.wv-evidence .row .tx{font-size:12.5px;line-height:1.65;color:#c3d2df}
.wv-evidence .row .tx b{color:var(--text)}
.layer-toggle{display:flex;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:10px;padding:4px;margin-top:14px}
.layer-toggle button{flex:1;height:32px;border-radius:7px;font-size:12.5px;color:var(--muted);transition:all .25s}
.layer-toggle button.active{background:var(--teal);color:#04121a;font-weight:600}

/* ============ 底部控制坞 ============ */
.bottom-dock{position:absolute;left:12px;bottom:12px;height:var(--dock-h);display:flex;align-items:center;gap:10px}
.zoom-controls{display:flex;align-items:center;gap:4px;height:44px;padding:0 6px;border-radius:22px;
  border:1px solid var(--line);background:var(--panel)}
.zoom-controls button{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--muted);font-size:18px;font-family:var(--font-display);transition:all .2s}
.zoom-controls button:hover{color:var(--text);background:rgba(255,255,255,.07)}
.zoom-controls .divider{width:1px;height:20px;background:var(--line);margin:0 2px}
#resetView{font-size:12px;width:auto;padding:0 12px;border-radius:16px}

/* 拆解滑块 */
.explode-ctl{display:none;align-items:center;gap:12px;height:44px;padding:0 16px;border-radius:22px;
  border:1px solid var(--line);background:var(--panel)}
.explode-ctl.show{display:flex}
.explode-ctl span{font-size:12.5px;color:var(--muted);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:3px;border-radius:3px;
  background:linear-gradient(to right,var(--teal) 0%,var(--teal) 0%,rgba(132,172,206,.2) 0%);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:var(--teal);border:3px solid #08131c;box-shadow:0 0 0 1px var(--teal);cursor:pointer}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--teal);
  border:3px solid #08131c;cursor:pointer}
.explode-val{font-family:var(--font-display);font-size:13px;color:var(--teal);width:34px;text-align:right}

/* ============ 坐标读数 ============ */
.coord-readout{position:absolute;right:12px;bottom:14px;display:flex;gap:14px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;
  font-family:var(--font-display);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.coord-readout b{color:var(--text);font-weight:600}
.coord-readout .sep{width:1px;height:14px;background:var(--line)}
body.panel-open .coord-readout{opacity:0;transform:translateX(16px);pointer-events:none;
  transition:opacity .3s ease,transform .3s ease}

/* ============ 右下角：太阳直射点概况图 ============ */
.sun-overview{position:absolute;right:12px;bottom:70px;width:252px;z-index:20;
  background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;
  padding:11px 13px 11px;backdrop-filter:blur(10px);
  opacity:0;transform:translateX(16px);pointer-events:none;
  transition:opacity .3s ease,transform .3s ease}
.sun-overview.show{opacity:1;transform:translateX(0);pointer-events:auto}
body.solar-mode .sun-overview{opacity:0!important;transform:translateX(16px)!important;pointer-events:none!important}
body.panel-open .sun-overview{opacity:0;transform:translateX(16px);pointer-events:none}
.so-head{display:flex;justify-content:space-between;align-items:center;gap:8px;
  width:100%;cursor:pointer;background:none;border:none;color:inherit;font-family:inherit;padding:0}
.so-head-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.so-title{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--text);white-space:nowrap}
.so-date-row{margin:2px 0 2px}
.so-date{font-size:11px;color:var(--amber);font-variant-numeric:tabular-nums}
.so-dec-head{font-size:11.5px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.so-chev{width:13px;height:13px;stroke:var(--muted);transition:transform .25s ease;flex-shrink:0}
.sun-overview.collapsed .so-chev{transform:rotate(-90deg)}
.so-body{margin-top:8px}
.so-svg{display:block;width:100%;height:auto;margin-top:4px}
.so-svg + .so-svg{margin-top:8px}
.so-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;
  font-size:11.5px;color:var(--muted)}
.so-foot b{color:var(--text);font-family:var(--font-display);font-variant-numeric:tabular-nums}
.sun-overview.collapsed .so-body{display:none}
@media (min-width:768px) and (min-height:500px){
  .sun-overview{right:22px;bottom:70px}
}
@media (max-width:767px) and (orientation:portrait){

/* ============ 悬浮提示 ============ */
.tooltip{position:fixed;z-index:50;pointer-events:none;background:var(--panel-solid);
  border:1px solid var(--line-strong);border-radius:8px;padding:7px 11px;font-size:12.5px;
  opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s;white-space:nowrap;
  box-shadow:0 10px 26px rgba(0,0,0,.5)}
.tooltip.show{opacity:1;transform:translateY(0)}
.tooltip b{font-weight:600;font-size:13px}
.tooltip small{display:block;color:var(--muted);font-size:11px;margin-top:2px}

/* ============ Toast ============ */
#toast{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:60;display:flex;
  flex-direction:column;gap:8px;align-items:center}
.toast-msg{background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:10px;
  padding:10px 18px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.45);
  animation:toastIn .35s cubic-bezier(.22,1,.36,1)}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}}
.toast-msg.out{animation:toastOut .3s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}

.kb-head{display:flex;align-items:center;gap:18px;padding:20px 30px 16px;border-bottom:1px solid var(--line)}

  padding:24px;background:rgba(4,7,13,.72);backdrop-filter:blur(6px);

.settings-modal.open{opacity:1;visibility:visible;transition-delay:0s}

.quality-opt.active{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.quality-note{font-size:11.5px;color:var(--faint);line-height:1.55;margin-top:8px}
.set-label{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#c3d2df;margin-bottom:10px}

/* ============================================================
   液态玻璃主题 · LIQUID GLASS
   统一的半透明渐变填充 / 背景模糊 / 边缘折射高光 / 柔和投影
   ============================================================ */
:root{
  --lg-warm:rgba(255,255,255,.55);
  --lg-fill:linear-gradient(152deg,rgba(255,255,255,.21) 0%,rgba(255,255,255,.075) 34%,rgba(255,255,255,.032) 64%,rgba(255,255,255,.14) 100%);
  --lg-fill-soft:linear-gradient(152deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.035) 55%,rgba(255,255,255,.075) 100%);
  --lg-tint:rgba(13,26,41,.46);
  --lg-tint-strong:rgba(12,24,38,.6);
  --lg-stroke:rgba(255,255,255,.17);
  --lg-stroke-strong:rgba(255,255,255,.30);
  --lg-blur:saturate(185%) blur(20px);
  --lg-blur-soft:saturate(165%) blur(12px);
  --lg-shadow:0 18px 44px rgba(0,0,0,.42),0 3px 10px rgba(0,0,0,.26);
  --lg-inner:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.12),inset 0 0 30px rgba(126,205,255,.07),0 0 0 1px rgba(255,255,255,.04);
  --lg-inner-soft:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 18px rgba(126,205,255,.06);
}
/* 玻璃质感基类：可在需要时直接复用 */
.lg-surface{
  background-color:var(--lg-tint);background-image:var(--lg-fill);
  border:1px solid var(--lg-stroke);backdrop-filter:var(--lg-blur);
  -webkit-backdrop-filter:var(--lg-blur);
  box-shadow:var(--lg-inner),var(--lg-shadow);
}

/* ---------- 顶栏 / 搜索 ---------- */
.topbar{background:linear-gradient(to bottom,rgba(4,7,13,.80) 0%,rgba(4,7,13,.34) 62%,rgba(4,7,13,0) 100%)}
.brand-txt b,.brand-txt small{text-shadow:0 2px 10px rgba(0,0,0,.65)}
.search input{
  border-radius:13px;border:1px solid var(--lg-stroke);
  background-color:rgba(11,22,36,.42);background-image:var(--lg-fill-soft);
  backdrop-filter:var(--lg-blur-soft);-webkit-backdrop-filter:var(--lg-blur-soft);
  box-shadow:var(--lg-inner-soft),0 10px 26px rgba(0,0,0,.28);
  text-shadow:0 1px 2px rgba(0,0,0,.35)}
.search input:focus{
  border-color:rgba(56,214,187,.58);background-color:rgba(9,24,34,.5);
  box-shadow:var(--lg-inner-soft),0 0 0 3px rgba(56,214,187,.13),0 12px 30px rgba(0,0,0,.32)}
.search-results{
  border-radius:14px;border:1px solid var(--lg-stroke-strong);
  background-color:rgba(9,18,30,.6);background-image:var(--lg-fill);
  backdrop-filter:var(--lg-blur);-webkit-backdrop-filter:var(--lg-blur);
  box-shadow:var(--lg-inner),0 24px 54px rgba(0,0,0,.52)}
.sr-item{border-bottom:1px solid rgba(255,255,255,.07)}
.sr-item:hover{background:rgba(56,214,187,.1)}
.sr-kind{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.05)}

.icon-btn{
  border-radius:12px;border:1px solid var(--lg-stroke);
  background-color:rgba(11,22,36,.4);background-image:var(--lg-fill-soft);
  backdrop-filter:var(--lg-blur-soft);-webkit-backdrop-filter:var(--lg-blur-soft);
  box-shadow:var(--lg-inner-soft),0 8px 20px rgba(0,0,0,.24);color:#cfdde9}
.icon-btn:hover{border-color:var(--lg-stroke-strong);color:#fff;
  background-color:rgba(22,38,56,.52);box-shadow:var(--lg-inner-soft),0 10px 26px rgba(0,0,0,.3)}
.icon-btn.active{color:#c8fff4;border-color:rgba(56,214,187,.55);
  background-color:rgba(24,86,82,.42);
  background-image:linear-gradient(152deg,rgba(56,214,187,.32),rgba(56,214,187,.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 0 22px rgba(56,214,187,.22)}

/* ---------- 图层导航 ---------- */
.layer-btn{
  border-radius:15px;border:1px solid var(--lg-stroke);
  background-color:rgba(10,21,34,.4);background-image:var(--lg-fill-soft);
  backdrop-filter:var(--lg-blur-soft);-webkit-backdrop-filter:var(--lg-blur-soft);
  box-shadow:var(--lg-inner-soft),0 8px 22px rgba(0,0,0,.24);color:#b6c8d7}
.layer-btn:not(.active):hover{color:#fff;border-color:var(--lg-stroke-strong);
  background-color:rgba(20,36,54,.52);box-shadow:var(--lg-inner-soft),0 10px 26px rgba(0,0,0,.3)}
.layer-btn.active{
  color:#f0fffb;border-color:rgba(56,214,187,.62);
  background-color:rgba(20,92,84,.4);
  background-image:linear-gradient(152deg,rgba(72,232,203,.42) 0%,rgba(38,160,146,.2) 55%,rgba(56,214,187,.12) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.08),0 0 24px rgba(56,214,187,.28),0 10px 26px rgba(0,0,0,.26);
  font-weight:600}

/* ---------- 详情面板 ---------- */
.detail-panel{
  z-index:30;border-radius:22px 22px 0 0;border:1px solid var(--lg-stroke-strong);border-bottom:none;
  background-color:var(--lg-tint-strong);background-image:var(--lg-fill);

  box-shadow:var(--lg-inner),0 -22px 60px rgba(0,0,0,.5);overflow:hidden}
.detail-panel::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(130% 55% at 14% -6%,rgba(255,255,255,.2) 0%,rgba(255,255,255,0) 62%)}
.detail-grab{background:rgba(255,255,255,.28);box-shadow:0 1px 0 rgba(255,255,255,.22)}
.detail-close{border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.05)}
.detail-close:hover{background:rgba(255,255,255,.12);border-color:var(--lg-stroke)}
.dp-cell,.wv-fact,.wv-chip,.wave-diagram,.wv-vib .box,.wv-seismo,.wv-evidence .row,.dp-layer-row,.solar-ctl{
  border-color:rgba(255,255,255,.13);

.dp-cell,.wv-fact{border-radius:12px}
.dp-list-item{border-radius:12px;border-color:rgba(255,255,255,.13);
  background-color:rgba(255,255,255,.045);background-image:var(--lg-fill-soft);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.dp-list-item:hover,.dp-list-item.active{
  border-color:rgba(56,214,187,.5);
  background-color:rgba(30,102,96,.3);
  background-image:linear-gradient(152deg,rgba(56,214,187,.24),rgba(56,214,187,.05));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 0 18px rgba(56,214,187,.16)}
.dp-layer-row.sel{border-color:rgba(56,214,187,.5);
  background-color:rgba(30,102,96,.26);
  background-image:linear-gradient(152deg,rgba(56,214,187,.22),rgba(56,214,187,.04));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 0 18px rgba(56,214,187,.14)}
.dp-note{border-radius:10px;border-left:2px solid rgba(230,178,95,.85);
  background-color:rgba(230,178,95,.10);background-image:linear-gradient(152deg,rgba(255,214,150,.08),rgba(230,178,95,.02))}
.dp-photo{border-color:rgba(255,255,255,.14);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.dp-table th{border-bottom-color:rgba(255,255,255,.1)}
.dp-table td{border-bottom-color:rgba(255,255,255,.07)}
.layer-toggle{border-radius:12px;border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.045)}
.layer-toggle button{border-radius:9px}
.layer-toggle button.active{background-image:linear-gradient(152deg,rgba(72,232,203,.42),rgba(56,214,187,.16));
  background-color:rgba(20,92,84,.4);color:#f0fffb;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.36),0 0 18px rgba(56,214,187,.2)}
.solar-ctl,.solar-play{border-radius:12px}
.solar-play{background-color:rgba(30,102,96,.32);
  background-image:linear-gradient(152deg,rgba(56,214,187,.26),rgba(56,214,187,.06));
  border-color:rgba(56,214,187,.5);color:#bff9ef;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 0 18px rgba(56,214,187,.14)}
.solar-play:hover{background-color:rgba(56,214,187,.9);color:#032018}

/* ---------- 底部控制坞 / 读数 ---------- */
.zoom-controls,.explode-ctl{
  border-radius:24px;border:1px solid var(--lg-stroke);
  background-color:rgba(10,21,34,.42);background-image:var(--lg-fill-soft);
  backdrop-filter:var(--lg-blur-soft);-webkit-backdrop-filter:var(--lg-blur-soft);
  box-shadow:var(--lg-inner-soft),0 12px 30px rgba(0,0,0,.3)}
.zoom-controls button{border-radius:50%}
.zoom-controls button:hover{background:rgba(255,255,255,.12)}
.zoom-controls .divider{background:rgba(255,255,255,.16)}
#resetView{border-radius:16px}
.coord-readout{
  border-radius:13px;border:1px solid var(--lg-stroke);
  background-color:rgba(10,21,34,.42);background-image:var(--lg-fill-soft);
  backdrop-filter:var(--lg-blur-soft);-webkit-backdrop-filter:var(--lg-blur-soft);
  box-shadow:var(--lg-inner-soft),0 10px 26px rgba(0,0,0,.28)}
.coord-readout .sep{background:rgba(255,255,255,.16)}

/* ---------- 太阳直射点概况图 ---------- */
.sun-overview{
  border-radius:18px;border:1px solid var(--lg-stroke-strong);
  background-color:rgba(13,26,41,.54);background-image:var(--lg-fill);
  backdrop-filter:var(--lg-blur);-webkit-backdrop-filter:var(--lg-blur);
  box-shadow:var(--lg-inner),0 20px 46px rgba(0,0,0,.42);
  overflow:hidden}
.sun-overview::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(120% 60% at 10% -10%,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 58%)}
.sun-overview{transition:opacity .3s ease,transform .3s ease,right .38s cubic-bezier(.22,1,.36,1),bottom .38s cubic-bezier(.22,1,.36,1)}
.sun-overview.dragging{transition:none}
.sun-overview.placed{right:auto;bottom:auto}
.so-head{cursor:grab;touch-action:none;user-select:none;position:relative;z-index:1}
.sun-overview.dragging{cursor:grabbing;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 0 30px rgba(126,205,255,.1),0 30px 70px rgba(0,0,0,.55);
  border-color:rgba(255,255,255,.4)}
.sun-overview.dragging .so-head{cursor:grabbing}
.sun-overview.locked .so-head{cursor:default}
.sun-overview.locked{border-color:rgba(230,178,95,.34)}
.so-title{display:inline-flex;align-items:center;gap:6px}
.so-grip{display:inline-flex;flex-wrap:wrap;width:10px;height:10px;gap:2px;opacity:.5;flex:none}
.so-grip i{width:4px;height:4px;border-radius:50%;background:currentColor;display:block}
.so-reset{display:none;width:24px;height:24px;border-radius:9px;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer;transition:.2s}
.sun-overview.placed .so-reset{display:flex}
.so-reset:hover{color:#fff;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.12)}
.so-reset svg{width:13px;height:13px}
.so-lock{width:24px;height:24px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:#9fb2c4;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.055);
  transition:all .22s;flex:none}
.so-lock:hover{color:#fff;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.12)}
.so-lock svg{width:13px;height:13px}
.sun-overview.locked .so-lock{color:#ffd48f;border-color:rgba(230,178,95,.55);
  background:rgba(230,178,95,.16);box-shadow:0 0 14px rgba(230,178,95,.24)}
.so-lock .ic-unlocked,.so-lock .ic-locked{display:none}
.sun-overview:not(.locked) .so-lock .ic-unlocked{display:block}
.sun-overview.locked .so-lock .ic-locked{display:block}
.so-date,.so-dec-head,.so-term{}
/* 详情面板打开时：默认停靠位隐藏；用户拖动过则保留 */
body.panel-open .sun-overview:not(.moved){opacity:0;transform:translateX(16px);pointer-events:none}
body.panel-open .sun-overview.moved.show{opacity:1;transform:none;pointer-events:auto}
/* 桌面端：详情面板打开时让位到面板左侧，不再整体消失 */
@media (min-width:768px) and (min-height:500px){
  body.panel-open .sun-overview.show:not(.placed){right:406px;bottom:70px;opacity:1;transform:none;pointer-events:auto}
}
/* 竖屏手机：让位到顶栏下方（面板打开时自动收起），不被底部抽屉遮住 */
@media (max-width:767px) and (orientation:portrait){
  body.panel-open .sun-overview.show:not(.placed){right:10px;bottom:auto;top:62px;opacity:1;transform:none;pointer-events:auto}
  body.panel-open .sun-overview.moved.show{opacity:1;pointer-events:auto}
}
/* 横屏矮屏：右侧抽屉占位，面板打开时暂时收起 */
@media (orientation:landscape) and (max-height:500px){
  body.panel-open .sun-overview.moved.show{opacity:0;pointer-events:none}
}

/* ---------- 提示 / 轻提示 ---------- */
.tooltip{border-radius:11px;border:1px solid var(--lg-stroke-strong);
  background-color:rgba(9,18,30,.62);background-image:var(--lg-fill);
  backdrop-filter:var(--lg-blur-soft);-webkit-backdrop-filter:var(--lg-blur-soft);
  box-shadow:var(--lg-inner-soft),0 14px 34px rgba(0,0,0,.46)}
.toast-msg{border-radius:13px;border:1px solid var(--lg-stroke-strong);
  background-color:rgba(9,18,30,.62);background-image:var(--lg-fill);
  backdrop-filter:var(--lg-blur-soft);-webkit-backdrop-filter:var(--lg-blur-soft);
  box-shadow:var(--lg-inner-soft),0 16px 38px rgba(0,0,0,.46)}

/* ---------- 地理知识库 ---------- */
.kb-overlay{background:rgba(5,11,20,.5);backdrop-filter:saturate(165%) blur(26px);
  -webkit-backdrop-filter:saturate(165%) blur(26px)}
.kb-head{border-bottom:1px solid rgba(255,255,255,.1)}
.kb-search{border-radius:14px;border:1px solid var(--lg-stroke);
  background-color:rgba(10,21,34,.44);background-image:var(--lg-fill-soft);
  backdrop-filter:var(--lg-blur-soft);-webkit-backdrop-filter:var(--lg-blur-soft);
  box-shadow:var(--lg-inner-soft),0 10px 26px rgba(0,0,0,.26)}
.kb-cats{border-bottom:1px solid rgba(255,255,255,.1)}
.kb-cat{border-radius:12px;border:1px solid var(--lg-stroke);
  background-color:rgba(10,21,34,.4);background-image:var(--lg-fill-soft);
  backdrop-filter:var(--lg-blur-soft);-webkit-backdrop-filter:var(--lg-blur-soft);
  box-shadow:var(--lg-inner-soft),0 6px 18px rgba(0,0,0,.2)}
.kb-cat.active{color:#d9fff8;border-color:rgba(56,214,187,.5);
  background-color:rgba(24,86,82,.36);
  background-image:linear-gradient(152deg,rgba(56,214,187,.3),rgba(56,214,187,.06));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 20px rgba(56,214,187,.16)}
.kb-card{border-radius:18px;border:1px solid var(--lg-stroke);
  background-color:rgba(11,22,36,.4);background-image:var(--lg-fill);
  backdrop-filter:var(--lg-blur-soft);-webkit-backdrop-filter:var(--lg-blur-soft);
  box-shadow:var(--lg-inner-soft),0 14px 34px rgba(0,0,0,.26);overflow:hidden;position:relative}
.kb-card:hover{border-color:rgba(255,255,255,.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 20px 44px rgba(0,0,0,.34)}
.kb-card.open{border-color:rgba(56,214,187,.4)}
.kb-points ul{border-top-color:rgba(255,255,255,.1)}

/* ---------- 设置弹层 ---------- */
.settings-modal{background:rgba(3,7,13,.52);backdrop-filter:saturate(160%) blur(20px);
  -webkit-backdrop-filter:saturate(160%) blur(20px)}
.settings-card{border-radius:24px;border:1px solid var(--lg-stroke-strong);
  background-color:rgba(13,26,42,.58);background-image:var(--lg-fill);
  backdrop-filter:var(--lg-blur);-webkit-backdrop-filter:var(--lg-blur);
  box-shadow:var(--lg-inner),0 30px 70px rgba(0,0,0,.55);overflow:hidden;position:relative}
.settings-card::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(120% 50% at 12% -8%,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 60%)}
.set-guide,.quality-opt{background-color:rgba(255,255,255,.05);background-image:var(--lg-fill-soft);
  border-color:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.set-guide,.set-reset,.quality-opt{border-radius:13px}
.set-guide{position:relative;z-index:1}
.set-row,.set-head,.set-reset{position:relative;z-index:1}
.quality-opt.active{border-color:rgba(56,214,187,.55);color:#c9fdf4;
  background-color:rgba(24,86,82,.34);
  background-image:linear-gradient(152deg,rgba(56,214,187,.26),rgba(56,214,187,.05));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 16px rgba(56,214,187,.14)}
.set-reset{border-color:rgba(255,255,255,.16);background-color:rgba(255,255,255,.05);
  background-image:var(--lg-fill-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.set-reset:hover{border-color:rgba(56,214,187,.5);color:#c9fdf4;
  background-color:rgba(24,86,82,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 0 16px rgba(56,214,187,.12)}

/* ---------- 滚动条 ---------- */
.detail-body,.kb-content,.settings-card,.search-results{scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.2) transparent}
.detail-body::-webkit-scrollbar,.kb-content::-webkit-scrollbar,.settings-card::-webkit-scrollbar{width:8px}
.detail-body::-webkit-scrollbar-thumb,.kb-content::-webkit-scrollbar-thumb,.settings-card::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.16);border-radius:8px}
.detail-body::-webkit-scrollbar-track,.kb-content::-webkit-scrollbar-track{background:transparent}

/* ---------- 环境适配 ---------- */
@media (max-width:767px){
  :root{--lg-blur:saturate(150%) blur(9px);--lg-blur-soft:saturate(140%) blur(5px)}
  .search input,.icon-btn,.layer-btn,.coord-readout,.zoom-controls{-webkit-backdrop-filter:none;backdrop-filter:none}
}
/* 低性能档：实时模糊全部关掉，用更实的玻璃填充兜住质感 */
body.perf-low *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
body.perf-low .icon-btn,body.perf-low .layer-btn,body.perf-low .search input,
body.perf-low .coord-readout,body.perf-low .zoom-controls,body.perf-low .sun-overview,
body.perf-low .detail-panel,body.perf-low .settings-card,body.perf-low .bottom-dock{
  background-color:rgba(9,16,26,.82)}
body.perf-low .kb-overlay,body.perf-low .settings-modal{background-color:rgba(4,7,13,.72)}
@media (orientation:landscape) and (max-height:500px){
  .detail-panel{border-radius:18px 0 0 18px}
}
@media (prefers-reduced-transparency:reduce){
  .sun-overview,.detail-panel,.settings-card,.kb-card,.kb-overlay,.search-results,.icon-btn,.layer-btn{
    background-color:rgba(8,16,27,.92);backdrop-filter:none;-webkit-backdrop-filter:none}
}
@supports not ((backdrop-filter:blur(8px)) or (-webkit-backdrop-filter:blur(8px))){
  .sun-overview,.detail-panel,.settings-card,.kb-card,.kb-overlay,.search-results,.icon-btn,.layer-btn,
  .zoom-controls,.explode-ctl,.coord-readout,.kb-search,.kb-cat,.search input,.tooltip,.toast-msg{
    background-color:rgba(8,16,27,.9)}
}

/* ============ 沉浸式调节（拖动滑条时隐去全部界面，只留调节条） ============ */
body.adjust-mode #app > :not(#adjustFocus){
  visibility:hidden!important;pointer-events:none!important}
.adjust-focus{position:fixed;inset:0;z-index:98;display:flex;align-items:flex-end;justify-content:center;
  padding:24px 24px 104px;pointer-events:auto;
  background:radial-gradient(92% 92% at 50% 38%,rgba(3,8,14,.06) 0%,rgba(3,8,14,.44) 100%);
  opacity:0;visibility:hidden;transition:opacity .3s cubic-bezier(.22,1,.36,1),visibility 0s linear .3s}
.adjust-focus.on{opacity:1;visibility:visible;transition-delay:0s}
.af-inner{width:min(80vw,560px);padding:24px 30px 20px;border-radius:30px;
  border:1px solid rgba(255,255,255,.22);
  background-color:rgba(14,27,43,.46);background-image:var(--lg-fill);
  backdrop-filter:blur(26px) saturate(185%);-webkit-backdrop-filter:blur(26px) saturate(185%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.44),inset 0 -1px 0 rgba(255,255,255,.1),
    0 34px 90px rgba(0,0,0,.58),0 0 70px rgba(255,200,120,.10);
  transform:translateY(10px) scale(.97);transition:transform .34s cubic-bezier(.22,1,.36,1)}
.adjust-focus.on .af-inner{transform:translateY(0) scale(1)}
.af-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.af-icon{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff6df;border:1px solid rgba(255,225,170,.55);
  background:radial-gradient(120% 120% at 30% 20%,rgba(255,236,190,.55),rgba(255,193,94,.24) 60%,rgba(255,170,60,.1));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 24px rgba(255,199,110,.4)}
.af-icon svg{width:20px;height:20px}
.af-meta{flex:1;display:flex;align-items:baseline;justify-content:space-between;gap:16px;min-width:0}
.af-label{font-size:14px;letter-spacing:.06em;color:#dbe8f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.af-val{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;color:#ffe8bd;
  font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(255,199,110,.55)}
.af-slider{padding:16px 0 18px;cursor:pointer;touch-action:none;outline:none}
.af-slider:focus-visible .af-track{box-shadow:0 0 0 2px rgba(255,214,140,.35)}
.af-track{position:relative;height:16px;border-radius:9px;background:rgba(255,255,255,.13);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.08)}
.af-track i{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:9px;
  background:linear-gradient(90deg,rgba(255,199,104,.85),rgba(255,244,214,.98));
  box-shadow:0 0 22px rgba(255,205,120,.7);transition:width .08s linear}
.af-knob{position:absolute;top:50%;left:0%;width:32px;height:32px;border-radius:50%;
  transform:translate(-50%,-50%);background:radial-gradient(circle,#fffef9 0%,#ffe1a8 62%,rgba(255,206,130,.6) 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.85),0 4px 16px rgba(0,0,0,.45),0 0 26px rgba(255,206,126,.9);
  transition:left .08s linear}
.af-hint{margin-top:6px;font-size:11.5px;letter-spacing:.08em;color:rgba(190,210,228,.6);text-align:center}
@media (max-width:767px){
  .adjust-focus{padding:18px}
  .af-inner{width:100%;padding:20px 20px 18px;border-radius:26px}
  .af-val{font-size:26px}
  .af-head{gap:12px;margin-bottom:16px}
  .af-icon{width:38px;height:38px}.af-icon svg{width:18px;height:18px}
  .af-track{height:14px}
  .af-knob{width:28px;height:28px}
}
@media (orientation:landscape) and (max-height:500px){
  .af-inner{padding:16px 22px 14px}
  .af-head{margin-bottom:12px}
  .af-val{font-size:24px}
  .af-slider{padding:10px 0 12px}
}

.sec-legend{position:absolute;left:248px;bottom:96px;z-index:22;display:none;

/* 地标相册 */
.dp-gallery{display:flex;gap:7px;margin:9px 0 2px}
.dp-thumb{flex:0 0 auto;width:62px;height:46px;padding:0;border-radius:9px;overflow:hidden;
  border:1px solid rgba(140,200,220,.16);background:rgba(10,22,30,.6);cursor:pointer;
  opacity:.55;transition:opacity .18s,border-color .18s,transform .18s}
.dp-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dp-thumb:hover{opacity:.85;transform:translateY(-1px)}
.dp-thumb.active{opacity:1;border-color:var(--accent, #36c8a0);box-shadow:0 0 0 1px rgba(54,200,160,.35)}

.dp-photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0 4px}
.dp-photo-grid > :only-child{grid-column:1 / -1}
.dp-photo-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;
  border:1px solid rgba(140,200,220,.14);background:#0b151c;display:block}
</style>
</head>
<body>
<!-- 加载屏 -->
<div id="loader">
  <div class="loader-ring"></div>
  <div class="loader-title">地球研习所</div>
  <div class="loader-bar"><i id="loaderBar"></i></div>
  <div class="loader-sub" id="loaderSub">正在初始化三维场景…</div>
</div>

<div id="canvasHost"></div>

<div id="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13.5" fill="none" stroke="#38d6bb" stroke-width="2"/>
      <ellipse cx="16" cy="16" rx="6.5" ry="13.5" fill="none" stroke="#38d6bb" stroke-width="1.3"/>
      <path d="M3.5 16h25M5.5 9.5h21M5.5 22.5h21" stroke="#38d6bb" stroke-width="1.1" fill="none"/></svg>
      <div class="brand-txt"><b>地球研习所</b><small>TERRA&nbsp;STUDIO</small></div>
    </div>
    <div class="search interactive" id="searchBox">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="搜索建筑、洋流、城市…" autocomplete="off">
      <button class="clear" id="searchClear" aria-label="清空">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="top-actions interactive">
      <button class="icon-btn" id="kbBtn" aria-label="地理知识库" title="地理知识库">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/></svg>
      </button>
      <button class="icon-btn" id="sunBtn" aria-label="日照与季节" title="日照与季节">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="autoRotateBtn" aria-label="自动旋转" title="自动旋转">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="factsBtn" aria-label="地球概况" title="地球概况">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="设置" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- 图层导航 -->
  <nav class="layer-panel interactive" id="layerPanel">
    <button class="layer-btn" data-layer="solar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.4"/><ellipse cx="12" cy="12" rx="10" ry="4.2"/><circle cx="19.5" cy="8.6" r="1.1" fill="currentColor" stroke="none"/></svg>
      太阳系</button>
    <button class="layer-btn active" data-layer="natural">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9S14.5 18.3 12 21c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3Z"/></svg>
      自然地球</button>
    <button class="layer-btn" data-layer="climate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 14h4l2-3 3 5 2-4 2 2h5"/><path d="M4 19h16"/></svg>
      气候带</button>
    <button class="layer-btn" data-layer="current">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8c3 0 3 3 6 3s3-3 6-3 3 3 6 3M3 16c3 0 3-3 6-3s3 3 6 3 3-3 6-3"/></svg>
      洋流</button>
    <button class="layer-btn" data-layer="landmark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10l5-3v13M12 20V4l5 3v13M19 20v-8l3 2v6M3 20h19"/></svg>
      特色建筑</button>
    <button class="layer-btn" data-layer="mountain">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 19l6-10 4 6 4-7 6 11z"/><path d="M8 9l2 3 2-2"/></svg>
      山脉</button>
    <button class="layer-btn" data-layer="china">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-9 4 5 3-4 6 8"/><path d="M3 20h18"/><circle cx="16" cy="6" r="2"/></svg>
      中国地理</button>
    <button class="layer-btn" data-layer="plate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3.5 10.5h6l2.5-3 3 3h5.5"/><path d="M12 21c-1.5-3-1.5-6 0-9"/></svg>
      板块构造</button>
    <button class="layer-btn" data-layer="quake">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h4l2-6 4 12 3-8 2 4h5"/></svg>
      地震带</button>
    <button class="layer-btn" data-layer="layer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="2"/></svg>
      圈层拆解</button>
    <button class="layer-btn" data-layer="wave">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h3l2.5-6 4 12 3-8 2 4h5.5"/><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/></svg>
      地震波</button>
  </nav>

  <!-- 详情面板 -->
  <div class="sec-legend" id="secLegend"></div>
  <aside class="detail-panel interactive" id="detailPanel">
    <div class="detail-grab"></div>
    <button class="detail-close" id="detailClose" aria-label="关闭">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="detail-body" id="detailBody"></div>
  </aside>

  <!-- 底部控制 -->
  <div class="bottom-dock interactive">
    <div class="zoom-controls">
      <button id="zoomOut" aria-label="缩小">−</button>
      <button id="resetView" aria-label="复位视角">复位</button>
      <button id="zoomIn" aria-label="放大">+</button>
    </div>
    <div class="explode-ctl" id="explodeCtl">
      <span>圈层拆解</span>
      <input type="range" id="explodeSlider" min="0" max="100" value="0" aria-label="拆解程度">
      <span class="explode-val" id="explodeVal">0%</span>
    </div>
  </div>

  <!-- 坐标读数 -->
  <div class="coord-readout interactive" id="coordReadout">
    <span class="label">纬度 <b id="latVal">--</b></span><span class="sep"></span>
    <span class="label">经度 <b id="lonVal">--</b></span>
  </div>

  <!-- 太阳直射点概况图 -->
  <div class="sun-overview" id="sunOverview">
    <div class="so-head" id="soToggle" role="button" tabindex="0" aria-expanded="true" aria-label="太阳直射点概况：点击折叠，按住可拖动">
      <span class="so-title"><span class="so-grip" aria-hidden="true"><i></i><i></i><i></i><i></i></span>太阳直射点概况</span>
      <span class="so-head-right">
        <b class="so-dec-head" id="soDecHead"></b>
        <button class="so-reset" id="soReset" type="button" aria-label="复位概况图位置" title="复位到默认位置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button class="so-lock" id="soLock" type="button" aria-label="锁定概况图位置" aria-pressed="false" title="锁定位置">
          <svg class="ic-unlocked" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2.4"/><path d="M8 11V7.8A4 4 0 0 1 16 7.8"/></svg>
          <svg class="ic-locked" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2.4"/><path d="M8 11V7.8A4 4 0 0 1 16 7.8V11"/></svg>
        </button>
        <svg class="so-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>
      </span>
    </div>
    <div class="so-body">
      <div class="so-date-row"><span class="so-date" id="soDate"></span></div>
      <svg class="so-svg" id="soEarth" viewBox="0 0 250 132" role="img" aria-label="直射纬度侧视示意"></svg>
      <svg class="so-svg" id="soCurve" viewBox="0 0 250 78" role="img" aria-label="直射点周年移动曲线"></svg>
      <div class="so-foot">
        <span id="soTerm"></span><b id="soDec"></b>
      </div>
    </div>
  </div>

  <!-- 地理知识库覆盖层 -->
  <div class="kb-overlay" id="kbOverlay" aria-hidden="true">
    <div class="kb-head">
      <div class="kb-title">
        <span class="kb-kicker">GEO KNOWLEDGE BASE</span>
        <h2>地理知识库</h2>
      </div>
      <div class="kb-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="kbSearch" type="text" placeholder="搜索知识点…" autocomplete="off">
      </div>
      <button class="icon-btn" id="kbClose" aria-label="关闭知识库">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="kb-cats" id="kbCats"></div>
    <div class="kb-content" id="kbContent"></div>
  </div>

  <!-- 设置弹层 -->
  <div class="settings-modal interactive" id="settingsModal" aria-hidden="true">
    <div class="settings-card" role="dialog" aria-modal="true" aria-label="设置">
      <div class="set-head">
        <h3>设置</h3>
        <button class="icon-btn" id="setClose" aria-label="关闭设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="set-guide">
        <div><span class="sg-key">拖动</span>旋转地球</div>
        <div><span class="sg-key">双指 / 滚轮</span>缩放并旋转</div>
        <div><span class="sg-key">双击 / + -</span>快速缩放</div>
        <div><span class="sg-key">点击标记</span>查看详情</div>
      </div>
      <div class="set-row">
        <div class="set-label">画质模式</div>
        <div class="quality-switch">
          <button class="quality-opt" type="button" data-quality="balanced">均衡</button>
          <button class="quality-opt" type="button" data-quality="uhd4k">4K 超清</button>
        </div>
        <div class="quality-note" id="qualityInfo">2K 模式按实际绘制缓冲控制；手机仍限制像素比，避免掉帧和过热。</div>
      </div>
      <div class="set-row">
        <div class="set-label">滑动灵敏度 <b id="rotVal">0.50</b></div>
        <input type="range" id="rotSens" min="0.2" max="2" step="0.01" value="0.5" aria-label="滑动灵敏度">
      </div>
      <div class="set-row">
        <div class="set-label">缩放灵敏度 <b id="zoomVal">0.75</b></div>
        <input type="range" id="zoomSens" min="0.2" max="2" step="0.01" value="0.75" aria-label="缩放灵敏度">
      </div>
      <button class="set-reset" id="setReset">恢复默认</button>
    </div>
  </div>

  <div class="tooltip" id="tooltip"></div>
  <div id="toast"></div>

  <!-- 沉浸式调节浮层：调节时隐去全部界面，只保留调节条 -->
  <div class="adjust-focus" id="adjustFocus" aria-hidden="true">
    <div class="af-inner">
      <div class="af-head">
        <div class="af-icon" id="afIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </div>
        <div class="af-meta">
          <span class="af-label" id="afLabel">调节</span>
          <b class="af-val" id="afVal">--</b>
        </div>
      </div>
      <div class="af-slider" id="afSlider" role="slider" tabindex="0"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="调节滑条">
        <div class="af-track" id="afTrack"><i id="afFill"></i><span class="af-knob" id="afKnob"></span></div>
      </div>
      <div class="af-hint">拖动调节 · 松手后自动恢复界面</div>
    </div>
  </div>
</div>

<script>
/* 引导器：优先取同源打包文件；失败或超时自动切备用直链，避免卡在加载页 */
(function(){
  var SRC=['https://aka.doubaocdn.com/s/KviuMAoh7D','./app.bundle.js?v=18'];
  var i=0,timer=null;
  window.__appStarted=function(){ if(timer){clearTimeout(timer);timer=null;} };
  function setSub(t,retry){
    var el=document.getElementById('loaderSub'); if(el)el.textContent=t;
    if(retry){ var l=document.getElementById('loader'); if(l)l.onclick=function(){location.reload();}; }
  }
  window.addEventListener('error',function(e){
    if(!window.__geoBooted) setSub('加载出错：'+(e.message||'脚本错误'),true);
  });
  function load(){
    if(window.__geoBooted||i>=SRC.length)return;
    var sc=document.createElement('script');
    /* 打包产物无 import/export，用传统脚本方式加载，避免 CDN 302 跳转触发模块 CORS 限制 */
    sc.async=true; sc.src=SRC[i];
    sc.onerror=function(){ step(); };
    document.body.appendChild(sc);
    timer=setTimeout(function(){ if(!window.__geoBooted) step(); },4500);
  }
  function step(){
    if(window.__geoBooted)return;
    if(timer){clearTimeout(timer);timer=null;}
    i++;
    if(i<SRC.length){ setSub('主线较慢，正在切换备用线路…'); load(); }
    else setSub('核心脚本加载失败，点按此处重试',true);
  }
  load();
})();
</script>
</body>
</html>
