<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地球研习所 · 交互式地理学习地球仪</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23071019' stroke='%2338d6bb' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='7' ry='14' fill='none' stroke='%2338d6bb' stroke-width='1.4'/%3E%3Cpath d='M3 16h26M5 9h22M5 23h22' stroke='%2338d6bb' stroke-width='1.2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<script type="importmap">
{ "imports": {
  "three": "https://fastly.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://fastly.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script src="https://fastly.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#04070d; --panel:rgba(9,16,26,.86); --panel-solid:#0a121d;
  --line:rgba(132,172,206,.16); --line-strong:rgba(132,172,205,.32);
  --text:#e7eff6; --muted:#8ba0b5; --faint:#5d7186;
  --teal:#38d6bb; --teal-dim:rgba(56,214,187,.14);
  --amber:#e6b25f; --warm:#ff7a4d; --cold:#53b7e8;
  --font-display:'Space Grotesk','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
  --font-body:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC','Space Grotesk',sans-serif;
  --dock-h:54px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--font-body);-webkit-font-smoothing:antialiased;font-size:14px}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
::selection{background:rgba(56,214,187,.3)}
#canvasHost{position:fixed;inset:0;z-index:0}
#canvasHost canvas{display:block;cursor:grab;touch-action:none}
#canvasHost canvas:active{cursor:grabbing}

/* ============ 加载屏 ============ */
#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .7s ease}
#loader.done{opacity:0;pointer-events:none}
.loader-ring{width:64px;height:64px;border-radius:50%;border:2px solid rgba(56,214,187,.18);
  border-top-color:var(--teal);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-title{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:.12em}
.loader-sub{color:var(--muted);font-size:13px;min-height:18px}
.loader-bar{width:200px;height:2px;background:rgba(132,172,206,.15);border-radius:2px;overflow:hidden}
.loader-bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .4s ease}

/* ============ 通用框架 ============ */
#app{position:fixed;inset:0;z-index:10;pointer-events:none}
#app .interactive{pointer-events:auto}
.topbar{position:absolute;top:0;left:0;right:0;height:58px;display:flex;align-items:center;
  gap:14px;padding:0 16px;
  background:linear-gradient(to bottom,rgba(4,7,13,.85),rgba(4,7,13,0))}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand svg{width:30px;height:30px}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-txt b{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.06em}
.brand-txt small{font-family:var(--font-display);font-size:9.5px;color:var(--teal);letter-spacing:.24em}

/* 搜索 */
.search{position:relative;flex:1;max-width:340px;margin:0 auto}
.search input{width:100%;height:38px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);padding:0 38px 0 36px;color:var(--text);font-size:13.5px;outline:none;
  transition:border-color .25s,background .25s}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--teal);background:var(--panel-solid)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;
  border-radius:6px;display:none;align-items:center;justify-content:center;color:var(--muted)}
.search .clear:hover{color:var(--text);background:rgba(255,255,255,.06)}
.search.has-val .clear{display:flex}
.search-results{position:absolute;top:44px;left:0;right:0;background:var(--panel-solid);
  border:1px solid var(--line-strong);border-radius:10px;max-height:320px;overflow-y:auto;
  display:none;box-shadow:0 18px 44px rgba(0,0,0,.5)}
.search-results.open{display:block}
.sr-item{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left;
  border-bottom:1px solid var(--line)}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:rgba(56,214,187,.08)}
.sr-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sr-name{font-size:13.5px;font-weight:500}
.sr-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.sr-kind{margin-left:auto;font-size:10.5px;color:var(--faint);font-family:var(--font-display);
  border:1px solid var(--line);border-radius:5px;padding:2px 6px;flex-shrink:0}

.top-actions{display:flex;gap:8px;flex-shrink:0}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .25s}
.icon-btn:hover{color:var(--text);border-color:var(--line-strong)}
.icon-btn.active{color:var(--teal);border-color:rgba(56,214,187,.5);background:var(--teal-dim)}
.icon-btn svg{width:17px;height:17px}

/* ============ 图层面板（移动端横向 chip） ============ */
.layer-panel{position:absolute;left:12px;right:12px;bottom:calc(var(--dock-h) + 14px);
  display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.layer-panel::-webkit-scrollbar{display:none}
.layer-btn{flex-shrink:0;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;
  border-radius:21px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  font-size:13px;transition:all .3s cubic-bezier(.22,1,.36,1)}
.layer-btn svg{width:16px;height:16px}
.layer-btn.active{color:#04121a;background:var(--teal);border-color:var(--teal);font-weight:600}
.layer-btn:not(.active):hover{color:var(--text);border-color:var(--line-strong)}

/* ============ 详情面板（移动端底部抽屉） ============ */
.detail-panel{position:absolute;left:0;right:0;bottom:0;max-height:62vh;background:var(--panel-solid);
  border-top:1px solid var(--line-strong);border-radius:18px 18px 0 0;
  transform:translateY(105%);transition:transform .45s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;box-shadow:0 -20px 50px rgba(0,0,0,.45)}
.detail-panel.open{transform:translateY(0)}
.detail-grab{width:38px;height:4px;border-radius:2px;background:var(--line-strong);margin:10px auto 4px;flex-shrink:0}
.detail-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.detail-close:hover{background:rgba(255,255,255,.07);color:var(--text)}
.detail-body{padding:6px 20px 24px;overflow-y:auto;flex:1}

/* ============ 详情内容元素 ============ */
.dp-kicker{font-family:var(--font-display);font-size:11px;letter-spacing:.2em;color:var(--teal);
  text-transform:uppercase;margin-bottom:8px}
.dp-title{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.25}
.dp-sub{color:var(--muted);font-size:13px;margin-top:5px}
.dp-desc{font-size:13.5px;line-height:1.75;color:#c3d2df;margin-top:14px}
.dp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:16px}
.dp-photo{width:100%;height:168px;object-fit:cover;object-position:center;border-radius:12px;margin-top:14px;display:block;border:1px solid rgba(255,255,255,.08)}
.dp-cell{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:rgba(255,255,255,.02)}
.dp-cell .k{font-size:11.5px;color:var(--faint);margin-bottom:5px}
.dp-cell .v{font-size:15px;font-weight:600;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.dp-cell .v small{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
.dp-section-title{font-family:var(--font-display);font-size:12.5px;font-weight:600;color:var(--muted);
  margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.dp-section-title::before{content:"";width:14px;height:2px;background:var(--teal);border-radius:1px}
.dp-table{width:100%;border-collapse:collapse;font-size:12.5px}
.dp-table th{text-align:left;color:var(--faint);font-weight:500;font-size:11.5px;padding:7px 8px;
  border-bottom:1px solid var(--line)}
.dp-table td{padding:9px 8px;border-bottom:1px solid var(--line);color:#c3d2df;vertical-align:top}
.dp-table td.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.dp-table tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;font-family:var(--font-display)}
.tag.warm{color:var(--warm);background:rgba(255,122,77,.12);border:1px solid rgba(255,122,77,.3)}
.tag.cold{color:var(--cold);background:rgba(83,183,232,.12);border:1px solid rgba(83,183,232,.3)}
.tag.teal{color:var(--teal);background:var(--teal-dim);border:1px solid rgba(56,214,187,.3)}
.dp-note{font-size:11.5px;color:var(--faint);margin-top:14px;line-height:1.6;
  padding:10px 12px;border-left:2px solid var(--amber);background:rgba(230,178,95,.06);border-radius:0 8px 8px 0}
.dp-list{display:flex;flex-direction:column;gap:8px}
.dp-list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;font-size:13px;cursor:pointer;transition:all .2s;text-align:left;width:100%}
.dp-list-item:hover{border-color:var(--teal);background:var(--teal-dim)}
.dp-list-item.active{border-color:var(--teal);background:var(--teal-dim);box-shadow:inset 0 0 0 1px rgba(56,214,187,.35)}
.dp-list-item.active .nm{color:var(--teal);font-weight:600}
.dp-list-item .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dp-list-item .thumb{width:46px;height:35px;object-fit:cover;border-radius:7px;flex-shrink:0;
  border:1px solid rgba(255,255,255,.1)}
.dp-list-item .nm{font-weight:500;min-width:0}
.dp-list-item .meta{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--font-display)}
.solar-ctl{display:flex;align-items:center;gap:14px;margin-top:16px;padding:12px 14px;
  border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);flex-wrap:wrap}
.solar-play{height:34px;padding:0 16px;border-radius:9px;background:var(--teal-dim);
  border:1px solid var(--teal);color:var(--teal);font-size:13px;transition:all .25s}
.solar-play:hover{background:var(--teal);color:#04121a}
.solar-speed{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.solar-speed input{flex:1;accent-color:var(--teal);height:4px}
.solar-speed .sv{font-family:var(--font-display);color:var(--text);font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
.dp-layer-row{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;
  transition:all .25s}
.dp-layer-row:hover{border-color:var(--line-strong)}
.dp-layer-row.sel{border-color:var(--teal);background:var(--teal-dim)}
.dp-layer-head{display:flex;align-items:center;gap:10px}
.dp-layer-sw{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.dp-layer-name{font-family:var(--font-display);font-weight:600;font-size:14.5px}
.dp-layer-depth{margin-left:auto;font-size:11.5px;color:var(--muted);font-family:var(--font-display)}
.dp-layer-facts{display:none;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.dp-layer-row.sel .dp-layer-facts{display:grid}
.dp-layer-facts .dp-cell{padding:9px 10px}
.dp-layer-facts .v{font-size:13px}
.dp-layer-row.static{cursor:default}
.dp-layer-row.static:hover{border-color:var(--line)}
.wave-diagram{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.02);margin-top:10px}
.wave-diagram svg{display:block;width:100%;height:auto}

/* ============ 地震波独立板块 ============ */
.wv-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.wv-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#c3d2df;
  border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:rgba(255,255,255,.02)}
.wv-chip .sw{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.wv-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;background:rgba(255,255,255,.02)}
.wv-card-head{display:flex;align-items:center;gap:10px}
.wv-card-head .sw{width:13px;height:13px;border-radius:50%;flex-shrink:0}
.wv-card-head .nm{font-family:var(--font-display);font-weight:600;font-size:15px}
.wv-card-head .alias{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--font-display)}
.wv-facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.wv-fact{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:rgba(255,255,255,.02)}
.wv-fact .k{font-size:11px;color:var(--faint);margin-bottom:4px}
.wv-fact .v{font-size:13px;line-height:1.5;color:#dbe8f1}
.wv-fact .v b{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.wv-card .wv-desc{font-size:12.5px;line-height:1.7;color:var(--muted);margin-top:10px}
.wv-vib{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.wv-vib .box{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.02)}
.wv-vib .box .t{font-size:12px;font-weight:600;margin-bottom:6px}
.wv-vib svg{display:block;width:100%;height:auto}
.wv-seismo{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.02);margin-top:12px}
.wv-seismo svg{display:block;width:100%;height:auto}
.wv-evidence{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.wv-evidence .row{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:rgba(255,255,255,.02)}
.wv-evidence .row .badge{flex-shrink:0;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:12px;font-weight:700;color:#04121a}
.wv-evidence .row .tx{font-size:12.5px;line-height:1.65;color:#c3d2df}
.wv-evidence .row .tx b{color:var(--text)}
.layer-toggle{display:flex;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:10px;padding:4px;margin-top:14px}
.layer-toggle button{flex:1;height:32px;border-radius:7px;font-size:12.5px;color:var(--muted);transition:all .25s}
.layer-toggle button.active{background:var(--teal);color:#04121a;font-weight:600}

/* ============ 底部控制坞 ============ */
.bottom-dock{position:absolute;left:12px;bottom:12px;height:var(--dock-h);display:flex;align-items:center;gap:10px}
.zoom-controls{display:flex;align-items:center;gap:4px;height:44px;padding:0 6px;border-radius:22px;
  border:1px solid var(--line);background:var(--panel)}
.zoom-controls button{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--muted);font-size:18px;font-family:var(--font-display);transition:all .2s}
.zoom-controls button:hover{color:var(--text);background:rgba(255,255,255,.07)}
.zoom-controls .divider{width:1px;height:20px;background:var(--line);margin:0 2px}
#resetView{font-size:12px;width:auto;padding:0 12px;border-radius:16px}

/* 拆解滑块 */
.explode-ctl{display:none;align-items:center;gap:12px;height:44px;padding:0 16px;border-radius:22px;
  border:1px solid var(--line);background:var(--panel)}
.explode-ctl.show{display:flex}
.explode-ctl span{font-size:12.5px;color:var(--muted);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:3px;border-radius:3px;
  background:linear-gradient(to right,var(--teal) 0%,var(--teal) 0%,rgba(132,172,206,.2) 0%);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:var(--teal);border:3px solid #08131c;box-shadow:0 0 0 1px var(--teal);cursor:pointer}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--teal);
  border:3px solid #08131c;cursor:pointer}
.explode-val{font-family:var(--font-display);font-size:13px;color:var(--teal);width:34px;text-align:right}

/* ============ 坐标读数 ============ */
.coord-readout{position:absolute;right:12px;bottom:14px;display:flex;gap:14px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;
  font-family:var(--font-display);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.coord-readout b{color:var(--text);font-weight:600}
.coord-readout .sep{width:1px;height:14px;background:var(--line)}
body.panel-open .coord-readout{opacity:0;transform:translateX(16px);pointer-events:none;
  transition:opacity .3s ease,transform .3s ease}

/* ============ 右下角：太阳直射点概况图 ============ */
.sun-overview{position:absolute;right:12px;bottom:70px;width:252px;z-index:20;
  background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;
  padding:11px 13px 11px;backdrop-filter:blur(10px);
  opacity:0;transform:translateX(16px);pointer-events:none;
  transition:opacity .3s ease,transform .3s ease}
.sun-overview.show{opacity:1;transform:translateX(0);pointer-events:auto}
body.panel-open .sun-overview{opacity:0;transform:translateX(16px);pointer-events:none}
.so-head{display:flex;justify-content:space-between;align-items:center;gap:8px;
  width:100%;cursor:pointer;background:none;border:none;color:inherit;font-family:inherit;padding:0}
.so-head-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.so-title{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--text);white-space:nowrap}
.so-date-row{margin:2px 0 2px}
.so-date{font-size:11px;color:var(--amber);font-variant-numeric:tabular-nums}
.so-dec-head{font-size:11.5px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.so-chev{width:13px;height:13px;stroke:var(--muted);transition:transform .25s ease;flex-shrink:0}
.sun-overview.collapsed .so-chev{transform:rotate(-90deg)}
.so-body{margin-top:8px}
.so-svg{display:block;width:100%;height:auto;margin-top:4px}
.so-svg + .so-svg{margin-top:8px}
.so-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;
  font-size:11.5px;color:var(--muted)}
.so-foot b{color:var(--text);font-family:var(--font-display);font-variant-numeric:tabular-nums}
.sun-overview.collapsed .so-body{display:none}
@media (min-width:768px) and (min-height:500px){
  .sun-overview{right:22px;bottom:70px}
}
@media (max-width:767px) and (orientation:portrait){
  .sun-overview{right:10px;bottom:calc(var(--dock-h) + 58px);width:216px;padding:10px 12px}
  .sun-overview.collapsed{width:auto;max-width:196px}
  .so-head{gap:6px}
}
@media (max-width:420px){
  .sun-overview{right:10px;bottom:calc(var(--dock-h) + 58px);width:208px}
  .sun-overview.collapsed{max-width:184px}
}

/* ============ 悬浮提示 ============ */
.tooltip{position:fixed;z-index:50;pointer-events:none;background:var(--panel-solid);
  border:1px solid var(--line-strong);border-radius:8px;padding:7px 11px;font-size:12.5px;
  opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s;white-space:nowrap;
  box-shadow:0 10px 26px rgba(0,0,0,.5)}
.tooltip.show{opacity:1;transform:translateY(0)}
.tooltip b{font-weight:600;font-size:13px}
.tooltip small{display:block;color:var(--muted);font-size:11px;margin-top:2px}

/* ============ Toast ============ */
#toast{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:60;display:flex;
  flex-direction:column;gap:8px;align-items:center}
.toast-msg{background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:10px;
  padding:10px 18px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.45);
  animation:toastIn .35s cubic-bezier(.22,1,.36,1)}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}}
.toast-msg.out{animation:toastOut .3s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}

/* ============ 地名标签（CSS2D，LOD 控制） ============ */
#labelHost{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#labelHost .geo-label{position:relative;user-select:none;white-space:nowrap;
  transform:translate(-50%,-50%);will-change:transform}
#labelHost .geo-label.country{font-family:var(--font-display);font-size:13.5px;font-weight:600;
  color:rgba(225,236,245,.72);letter-spacing:.08em;
  text-shadow:0 1px 5px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.9)}
#labelHost .geo-label.city{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;
  color:rgba(198,218,233,.92);text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9)}
#labelHost .geo-label.city i{width:5px;height:5px;border-radius:50%;background:var(--teal);
  flex-shrink:0;box-shadow:0 0 5px rgba(56,214,187,.8);transition:all .2s}
#labelHost .geo-label.city.clickable{pointer-events:auto;cursor:pointer;padding:4px 2px}
#labelHost .geo-label.city.clickable:hover{color:#fff}
#labelHost .geo-label.city.clickable:hover i{background:var(--amber);transform:scale(1.4);
  box-shadow:0 0 7px rgba(230,178,95,.9)}
#labelHost .geo-label.island{font-size:10.5px;color:rgba(190,208,224,.78);letter-spacing:.04em;
  text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9)}
#labelHost .geo-label.continent{font-family:var(--font-display);font-size:15px;font-weight:700;
  letter-spacing:.16em;color:rgba(235,244,251,.9);text-shadow:0 1px 6px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.9)}
#labelHost .geo-label.ocean{font-family:var(--font-display);font-size:13px;font-weight:500;font-style:italic;
  letter-spacing:.14em;color:rgba(151,199,226,.82);text-shadow:0 1px 5px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.9)}
#labelHost .geo-label.hidden{display:none}
#labelHost .geo-label.occluded{display:none}

/* ============ 板块名称标签 ============ */
#labelHost .plate-label{position:relative;transform:translate(-50%,-50%);white-space:nowrap;
  user-select:none;pointer-events:none;font-family:var(--font-display);font-size:14.5px;font-weight:700;
  letter-spacing:.14em;color:#eaf4fb;text-shadow:0 1px 5px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.9);
  padding:3px 11px;border-radius:9px;background:rgba(8,16,26,.6);border:1px solid rgba(255,255,255,.14)}
#labelHost .plate-label.hidden{display:none}
#labelHost .quake-label{position:relative;transform:translate(-50%,-50%);white-space:nowrap;
  user-select:none;pointer-events:none;font-family:var(--font-display);font-size:13px;font-weight:700;
  letter-spacing:.08em;color:#fff4f0;text-shadow:0 1px 5px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.9);
  padding:4px 10px;border-radius:9px;background:rgba(12,14,18,.68);border:1px solid rgba(255,110,80,.45)}
#labelHost .quake-label.hidden{display:none}

/* ============ 太阳系天体名称标签 ============ */
#labelHost .solar-label{position:relative;transform:translate(-50%,-50%);
  white-space:nowrap;user-select:none;pointer-events:auto;cursor:pointer;
  font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.05em;
  color:#e8f2fb;text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.9);
  padding:2px 7px;border-radius:7px;background:rgba(10,20,32,.46);
  border:1px solid rgba(120,170,200,.28);transition:all .2s}
#labelHost .solar-label:hover{background:var(--teal);color:#04121a;border-color:var(--teal)}
#labelHost .solar-label.sun{font-size:13.5px;color:#fff3d0;
  border-color:rgba(255,200,110,.5);background:rgba(40,26,8,.5)}
#labelHost .solar-label.sun:hover{background:var(--amber);color:#1a0f02;border-color:var(--amber)}

/* 竖屏面板打开时，图层条上移到抽屉上沿，避免被遮挡 */
@media (max-width:767px) and (orientation:portrait){
  body.panel-open .layer-panel{bottom:calc(62vh + 12px);transition:bottom .35s ease}
  body.panel-open .bottom-dock{opacity:0;pointer-events:none;transition:opacity .3s}
  .topbar{gap:10px;padding:0 10px}
  .brand-txt{display:none}
  .brand svg{width:26px;height:26px}
  .top-actions{gap:6px}
  .icon-btn{width:33px;height:33px}
  .icon-btn svg{width:16px;height:16px}
}

/* ============ 桌面端布局（要求足够高度，避免横屏手机误判） ============ */
@media (min-width:768px) and (min-height:500px){
  :root{--dock-h:58px}
  .topbar{padding:0 24px;height:64px}
  .layer-panel{left:22px;top:84px;bottom:auto;right:auto;flex-direction:column;gap:9px;
    width:208px;padding:0;overflow:visible}
  .layer-btn{width:100%;border-radius:12px;height:48px;padding:0 16px}
  .layer-btn.active{font-weight:600}
  .detail-panel{left:auto;right:22px;top:84px;bottom:22px;width:372px;max-height:none;
    border-radius:14px;border:1px solid var(--line-strong);transform:translateX(calc(100% + 40px));
    transition:transform .45s cubic-bezier(.22,1,.36,1)}
  .detail-panel.open{transform:translateX(0)}
  .detail-grab{display:none}
  .detail-body{padding:18px 22px 26px}
  .bottom-dock{left:50%;transform:translateX(-50%);bottom:18px}
  .coord-readout{right:22px;bottom:20px}
  #toast{top:82px}
}
@media (max-width:420px){
  .brand-txt small{display:none}
  .coord-readout{padding:7px 10px;gap:9px}
  .coord-readout .label{display:none}
  .search{max-width:none}
  .wv-facts,.wv-vib{grid-template-columns:1fr}
}
/* ============ 手机横屏（矮高度，右侧抽屉式布局） ============ */
@media (orientation:landscape) and (max-height:500px){
  .topbar{height:46px;padding:0 10px;gap:10px}
  .brand svg{width:24px;height:24px}
  .brand-txt b{font-size:13px}
  .brand-txt small{display:none}
  .search input{height:34px;font-size:12.5px}
  .icon-btn{width:34px;height:34px}
  .icon-btn svg{width:15px;height:15px}

  .layer-panel{bottom:calc(var(--dock-h) + 8px);left:10px;right:10px;gap:6px}
  .layer-btn{height:36px;padding:0 12px;font-size:12px}
  .layer-btn svg{width:14px;height:14px}

  .detail-panel{left:auto;right:0;top:46px;bottom:0;width:300px;max-height:none;
    border-radius:14px 0 0 0;border-top:none;
    transform:translateX(105%);transition:transform .4s cubic-bezier(.22,1,.36,1)}
  .detail-panel.open{transform:translateX(0)}
  .detail-grab{display:none}
  .detail-body{padding:14px 16px 20px}
  .dp-title{font-size:19px}

  body.panel-open .layer-panel{bottom:calc(var(--dock-h) + 8px);right:312px;left:10px;transition:right .35s}
  body.panel-open .bottom-dock{opacity:0;pointer-events:none;transition:opacity .3s}

  .bottom-dock{left:10px;bottom:8px;height:40px;gap:8px}
  .zoom-controls{height:36px}
  .zoom-controls button{width:28px;height:28px;font-size:16px}
  #resetView{padding:0 10px;font-size:11px}
  .coord-readout{right:10px;bottom:10px;padding:6px 10px;font-size:11px}
  .sun-overview{right:10px;bottom:calc(var(--dock-h) + 46px);width:236px;padding:10px 11px}
}

@media (prefers-reduced-motion:reduce){
  .loader-ring{animation-duration:2s}
  .detail-panel,.layer-btn,.icon-btn,.search-results{transition-duration:.01ms!important}
}

/* ============ 地理知识库覆盖层 ============ */
.kb-overlay{position:fixed;inset:0;z-index:90;background:rgba(4,7,13,.97);
  display:flex;flex-direction:column;pointer-events:auto;
  opacity:0;visibility:hidden;transform:translateY(18px);
  transition:opacity .42s cubic-bezier(.22,1,.36,1),transform .42s cubic-bezier(.22,1,.36,1),visibility 0s linear .42s}
.kb-overlay.open{opacity:1;visibility:visible;transform:translateY(0);transition-delay:0s}
.kb-head{display:flex;align-items:center;gap:18px;padding:20px 30px 16px;border-bottom:1px solid var(--line)}
.kb-title h2{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:.02em}
.kb-kicker{display:block;font-size:10.5px;letter-spacing:.28em;color:var(--teal);margin-bottom:5px}
.kb-search{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:0 13px;height:42px}
.kb-search svg{width:16px;height:16px;color:var(--muted);flex:none}
.kb-search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13.5px;height:100%}
.kb-search input::placeholder{color:var(--faint)}
#kbClose{flex:none;margin-left:auto}
.kb-cats{display:flex;gap:8px;padding:14px 30px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.kb-cats::-webkit-scrollbar{display:none}
.kb-cat{flex:none;display:flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:13px;
  transition:all .25s ease;white-space:nowrap}
.kb-cat svg{width:15px;height:15px}
.kb-cat:hover{color:var(--text);border-color:var(--line-strong)}
.kb-cat.active{background:var(--teal-dim);border-color:var(--teal);color:var(--teal)}
.kb-cat .cnt{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.kb-cat.active .cnt{color:var(--teal)}
.kb-content{flex:1;overflow-y:auto;padding:26px 30px 40px}
.kb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;max-width:1280px}
.kb-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  transition:border-color .25s ease,transform .25s ease;cursor:pointer}
.kb-card:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.kb-card h3{font-size:15px;font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.kb-card h3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal);flex:none}
.kb-card .kb-d{color:var(--muted);font-size:12.8px;line-height:1.65}
.kb-points{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.22,1,.36,1)}
.kb-card.open .kb-points{max-height:340px}
.kb-points ul{list-style:none;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.kb-points li{position:relative;padding-left:15px;font-size:12.5px;color:var(--text);line-height:1.5;margin-bottom:7px}
.kb-points li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--amber)}
.kb-empty{color:var(--faint);font-size:14px;padding:60px 0;text-align:center;width:100%}
.kb-sec-label{grid-column:1/-1;font-family:var(--font-display);font-size:13px;letter-spacing:.14em;color:var(--muted);margin:8px 0 2px}
@media (max-width:767px){
  .kb-head{flex-wrap:wrap;gap:12px;padding:16px 16px 13px}
  .kb-title h2{font-size:18px}
  .kb-search{order:3;flex-basis:100%;max-width:none;height:40px}
  #kbClose{margin-left:0}
  .kb-cats{padding:11px 16px}
  .kb-content{padding:18px 16px 34px}
  .kb-grid{grid-template-columns:1fr;gap:11px}
}
@media (orientation:landscape) and (max-height:500px){
  .kb-head{padding:10px 18px 9px;gap:14px}
  .kb-title h2{font-size:16px}
  .kb-kicker{margin-bottom:2px}
  .kb-search{height:36px}
  .kb-cats{padding:8px 18px}
  .kb-cat{height:33px}
  .kb-content{padding:14px 18px 24px}
  .kb-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px}
}

/* ============ 设置弹层 ============ */
.settings-modal{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(4,7,13,.72);backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;transition:opacity .35s cubic-bezier(.22,1,.36,1),visibility 0s linear .35s}
.settings-modal.open{opacity:1;visibility:visible;transition-delay:0s}
.settings-card{width:100%;max-width:388px;max-height:calc(100vh - 48px);overflow-y:auto;
  background:var(--panel-solid);border:1px solid var(--line-strong);
  border-radius:18px;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.55);
  transform:translateY(14px) scale(.98);transition:transform .35s cubic-bezier(.22,1,.36,1)}
.settings-modal.open .settings-card{transform:translateY(0) scale(1)}
.set-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.set-head h3{font-family:var(--font-display);font-size:17px;font-weight:600}
.set-head .icon-btn{width:32px;height:32px}
.set-guide{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.set-guide div{font-size:12.8px;color:var(--muted);line-height:1.9}
.sg-key{display:inline-block;min-width:64px;color:var(--teal);font-weight:600}
.set-row{margin-bottom:18px}
.quality-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.quality-opt{height:42px;border-radius:10px;border:1px solid var(--line-strong);
  background:var(--panel);font-size:13px;color:var(--muted);transition:all .22s}
.quality-opt.active{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.quality-note{font-size:11.5px;color:var(--faint);line-height:1.55;margin-top:8px}
.set-label{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#c3d2df;margin-bottom:10px}
.set-label b{font-family:var(--font-display);color:var(--teal);font-variant-numeric:tabular-nums;font-weight:600}
.settings-card input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--teal) 0%,var(--teal) var(--fill,26%),var(--line) var(--fill,26%),var(--line) 100%);
  outline:none;margin:0}
.settings-card input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;
  background:#06121a;border:2px solid var(--teal);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.settings-card input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#06121a;
  border:2px solid var(--teal);cursor:pointer}
.set-reset{width:100%;height:42px;border-radius:11px;border:1px solid var(--line-strong);background:var(--panel);
  color:#c3d2df;font-size:13.5px;cursor:pointer;transition:all .25s}
.set-reset:hover{border-color:var(--teal);color:var(--teal)}

/* ============================================================
   液态玻璃主题 · LIQUID GLASS
   统一的半透明渐变填充 / 背景模糊 / 边缘折射高光 / 柔和投影
   ============================================================ */
:root{
  --lg-warm:rgba(255,255,255,.55);
  --lg-fill:linear-gradient(152deg,rgba(255,255,255,.21) 0%,rgba(255,255,255,.075) 34%,rgba(255,255,255,.032) 64%,rgba(255,255,255,.14) 100%);
  --lg-fill-soft:linear-gradient(152deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.035) 55%,rgba(255,255,255,.075) 100%);
  --lg-tint:rgba(13,26,41,.46);
  --lg-tint-strong:rgba(12,24,38,.6);
  --lg-stroke:rgba(255,255,255,.17);
  --lg-stroke-strong:rgba(255,255,255,.30);
  --lg-blur:saturate(185%) blur(20px);
  --lg-blur-soft:saturate(165%) blur(12px);
  --lg-shadow:0 18px 44px rgba(0,0,0,.42),0 3px 10px rgba(0,0,0,.26);
  --lg-inner:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.12),inset 0 0 30px rgba(126,205,255,.07),0 0 0 1px rgba(255,255,255,.04);
  --lg-inner-soft:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 18px rgba(126,205,255,.06);
}
/* 玻璃质感基类：可在需要时直接复用 */
.lg-surface{
  background-color:var(--lg-tint);background-image:var(--lg-fill);
  border:1px solid var(--lg-stroke);backdrop-filter:var(--lg-blur);
  -webkit-backdrop-filter:var(--lg-blur);
  box-shadow:var(--lg-inner),var(--lg-shadow);
}

/* ---------- 顶栏 / 搜索 ---------- */
.topbar{background:linear-gradient(to bottom,rgba(4,7,13,.80) 0%,rgba(4,7,13,.34) 62%,rgba(4,7,13,0) 100%)}
.brand-txt b,.brand-txt small{text-shadow:0 2px 10px rgba(0,0,0,.65)}
.search input{
  border-radius:13px;border:1px solid var(--lg-stroke);
  background-color:rgba(11,22,36,.42);background-image:var(--lg-fill-soft);
  backdrop-filter:var(--lg-blur-soft);-webkit-backdrop-filter:var(--lg-blur-soft);
  box-shadow:var(--lg-inner-soft),0 10px 26px rgba(0,0,0,.28);
  text-shadow:0 1px 2px rgba(0,0,0,.35)}
.search input:focus{
  border-color:rgba(56,214,187,.58);background-color:rgba(9,24,34,.5);
  box-shadow:var(--lg-inner-soft),0 0 0 3px rgba(56,214,187,.13),0 12px 30px rgba(0,0,0,.32)}
.search-results{
  border-radius:14px;border:1px solid var(--lg-stroke-strong);
  background-color:rgba(9,18,30,.6);background-image:var(--lg-fill);
  backdrop-filter:var(--lg-blur);-webkit-backdrop-filter:var(--lg-blur);
  box-shadow:var(--lg-inner),0 24px 54px rgba(0,0,0,.52)}
.sr-item{border-bottom:1px solid rgba(255,255,255,.07)}
.sr-item:hover{background:rgba(56,214,187,.1)}
.sr-kind{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.05)}

.icon-btn{
  border-radius:12px;border:1px solid var(--lg-stroke);
  background-color:rgba(11,22,36,.4);background-image:var(--lg-fill-soft);
  backdrop-filter:var(--lg-blur-soft);-webkit-backdrop-filter:var(--lg-blur-soft);
  box-shadow:var(--lg-inner-soft),0 8px 20px rgba(0,0,0,.24);color:#cfdde9}
.icon-btn:hover{border-color:var(--lg-stroke-strong);color:#fff;
  background-color:rgba(22,38,56,.52);box-shadow:var(--lg-inner-soft),0 10px 26px rgba(0,0,0,.3)}
.icon-btn.active{color:#c8fff4;border-color:rgba(56,214,187,.55);
  background-color:rgba(24,86,82,.42);
  background-image:linear-gradient(152deg,rgba(56,214,187,.32),rgba(56,214,187,.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 0 22px rgba(56,214,187,.22)}

/* ---------- 图层导航 ---------- */
.layer-btn{
  border-radius:15px;border:1px solid var(--lg-stroke);
  background-color:rgba(10,21,34,.4);background-image:var(--lg-fill-soft);
  backdrop-filter:var(--lg-blur-soft);-webkit-backdrop-filter:var(--lg-blur-soft);
  box-shadow:var(--lg-inner-soft),0 8px 22px rgba(0,0,0,.24);color:#b6c8d7}
.layer-btn:not(.active):hover{color:#fff;border-color:var(--lg-stroke-strong);
  background-color:rgba(20,36,54,.52);box-shadow:var(--lg-inner-soft),0 10px 26px rgba(0,0,0,.3)}
.layer-btn.active{
  color:#f0fffb;border-color:rgba(56,214,187,.62);
  background-color:rgba(20,92,84,.4);
  background-image:linear-gradient(152deg,rgba(72,232,203,.42) 0%,rgba(38,160,146,.2) 55%,rgba(56,214,187,.12) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.08),0 0 24px rgba(56,214,187,.28),0 10px 26px rgba(0,0,0,.26);
  font-weight:600}

/* ---------- 详情面板 ---------- */
.detail-panel{
  z-index:30;border-radius:22px 22px 0 0;border:1px solid var(--lg-stroke-strong);border-bottom:none;
  background-color:var(--lg-tint-strong);background-image:var(--lg-fill);

/* 详情面板打开时：默认停靠位隐藏；用户拖动过则保留 */

  try{
    const q=localStorage.getItem('geo_quality');
    if(q==='balanced'||q==='hd2k')return q;
  }catch(e){}
  return isMobile?'balanced':'hd2k';
})();
function getQualityPixelRatio(){
  const dpr=window.devicePixelRatio||1;
  const cap=qualityMode==='hd2k'?(isMobile?2:2.25):(isMobile?1.5:1.75);
  if(qualityMode!=='hd2k')return Math.max(1,Math.min(dpr,cap));
  return Math.max(1,Math.min(cap,2560/window.innerWidth,1600/window.innerHeight));
}
function applyRenderQuality(){
  if(!renderer)return;
  renderer.setPixelRatio(getQualityPixelRatio());
  renderer.setSize(window.innerWidth,window.innerHeight);
  if(labelRenderer)labelRenderer.setSize(window.innerWidth,window.innerHeight);
  const info=document.getElementById('qualityInfo');
  if(info){
    const buf=renderer.getDrawingBufferSize(new THREE.Vector2());
    info.textContent=`当前绘制缓冲：${Math.round(buf.x)}×${Math.round(buf.y)}；手机端仍有像素比上限。`;
  }
}

function latLonToVec(lat, lon, r = RADIUS){
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta));
}
function vecToLatLon(v){
  const r = v.length();
  const lat = 90 - Math.acos(THREE.MathUtils.clamp(v.y / r,-1,1)) * 180 / Math.PI;
  let lon = Math.atan2(v.z, -v.x) * 180 / Math.PI - 180;
  if(lon < -180) lon += 360;
  return {lat, lon};
}
function fmtDMS(d, isLat){
  const hemi = isLat ? (d>=0?'N':'S') : (d>=0?'E':'W');
  const a = Math.abs(d), deg = Math.floor(a);
  const mF = (a-deg)*60, min = Math.floor(mF), sec = Math.round((mF-min)*60);
  return `${deg}°${String(min).padStart(2,'0')}′${String(sec).padStart(2,'0')}″${hemi}`;
}

/* 24 节气近似年积日（N）与名称 */
const SOLAR_TERMS = [
 {n:6,name:'小寒'},{n:20,name:'大寒'},{n:39,name:'立春'},{n:54,name:'雨水'},
 {n:65,name:'惊蛰'},{n:80,name:'春分'},{n:95,name:'清明'},{n:110,name:'谷雨'},
 {n:126,name:'立夏'},{n:141,name:'小满'},{n:157,name:'芒种'},{n:172,name:'夏至'},
 {n:188,name:'小暑'},{n:204,name:'大暑'},{n:220,name:'立秋'},{n:235,name:'处暑'},
 {n:251,name:'白露'},{n:266,name:'秋分'},{n:281,name:'寒露'},{n:296,name:'霜降'},
 {n:311,name:'立冬'},{n:326,name:'小雪'},{n:341,name:'大雪'},{n:356,name:'冬至'}
];
const KEY_TERMS = [{label:'春分',n:80},{label:'夏至',n:172},{label:'秋分',n:266},{label:'冬至',n:356}];
const MONTH_DAYS = [31,28,31,30,31,30,31,31,30,31,30,31];

function dayToMonthDay(n){
  let rest=n;
  for(let m=0;m<12;m++){
    if(rest<=MONTH_DAYS[m]) return {month:m+1,day:rest};
    rest-=MONTH_DAYS[m];
  }
  return {month:12,day:31};
}
function currentTerm(n){
  let best=SOLAR_TERMS[0], minD=999;
  for(const t of SOLAR_TERMS){
    const d=Math.min(Math.abs(t.n-n), 365-Math.abs(t.n-n));
    if(d<minD){minD=d;best=t;}
  }
  return best;
}
/* 太阳赤纬（度）：δ = 23.44 · sin(2π(N-81)/365) */
function solarDeclination(n){
  return 23.44 * Math.sin(2*Math.PI*(n-81)/365);
}
/* 给定纬度（度）与赤纬（度），计算昼长（小时） */
function dayLength(latDeg, decDeg){
  const phi=latDeg*Math.PI/180, dec=decDeg*Math.PI/180;
  const cosH = -Math.tan(phi)*Math.tan(dec);
  if(cosH<=-1) return 24;
  if(cosH>=1) return 0;
  return 2*Math.acos(cosH)*180/Math.PI/15;
}
function fmtHour(h){
  const hh=Math.floor(h), mm=Math.round((h-hh)*60);
  return `${hh}小时${mm?mm+'分':''}`;
}

/* 直射点：悬浮在地表上方的发光小球，模拟太阳 */
function createSolarMarker(){
  solarGroup = new THREE.Group();
  const glowTex = makeGlowTexture();
  const normal = latLonToVec(0,-90).normalize();
  solarGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), normal);
  solarGroup.position.copy(normal);

  const FLOAT = 0.075;
  solarGlow = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,
    color:0xffb24d, transparent:true, opacity:0.9, depthWrite:false, blending:THREE.AdditiveBlending}));
  solarGlow.position.y=FLOAT; solarGlow.scale.set(0.2,0.2,1);

  solarBall = new THREE.Group();
  const shell = new THREE.Mesh(new THREE.SphereGeometry(0.042,24,24),
    new THREE.MeshBasicMaterial({color:0xffc24d}));
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.024,20,20),
    new THREE.MeshBasicMaterial({color:0xfff3c4}));
  core.position.set(0.012,0.012,0.012);
  solarBall.add(shell,core);
  solarBall.position.y=FLOAT;

  solarGroup.add(solarGlow,solarBall);
  earthGroup.add(solarGroup);
}

/* 核心：按年积日更新太阳光照方向与直射点位置 */
function updateSun(n){
  const dec = solarDeclination(n);
  const dir = latLonToVec(dec, -90).normalize();
  sunLight.position.copy(dir).multiplyScalar(5);
  if(solarGroup){
    solarGroup.position.copy(dir);
    solarGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  }
  return dec;
}
function updateSolarPulse(){
  if(!solarGlow || !solarGroup.visible) return;
  const t=clock.elapsedTime;
  const s=1+Math.sin(t*2.4)*0.12;
  solarGlow.scale.set(0.2*s,0.2*s,1);
  solarGlow.material.opacity=0.75+0.2*Math.sin(t*2.4);
  if(solarBall){
    solarBall.position.y=0.075+Math.sin(t*1.6)*0.008;
    const bs=1+Math.sin(t*2.4)*0.06;
    solarBall.scale.set(bs,bs,bs);
  }
}

function initEarth(textures){

  scene.add(earthGroup);

  /* 各向异性过滤 + 高质量多级渐远，斜视与缩放时纹理依然清晰 */
  const maxAniso = renderer.capabilities.getMaxAnisotropy();
  ['color','normal','spec','clouds'].forEach(k=>{
    const tx=textures[k]; if(!tx)return;
    tx.anisotropy = maxAniso;
    tx.generateMipmaps = true;
    tx.minFilter = THREE.LinearMipmapLinearFilter;
    tx.magFilter = THREE.LinearFilter;
  });

  /* 球面细分按设备分级：2K 档位下桌面更圆滑，移动端仍控制顶点开销 */
  const SEG = isMobile ? 128 : 224;
  earthMesh = new THREE.Mesh(
    new THREE.SphereGeometry(RADIUS, SEG, SEG),
    new THREE.MeshPhongMaterial({
      map:textures.color, normalMap:textures.normal, specularMap:textures.spec,
      specular:new THREE.Color(0x2a4458), shininess:18, normalScale:new THREE.Vector2(0.62,0.62)
    }));

  cloudsMesh = new THREE.Mesh(

      alphaTest:0.015, depthWrite:false}));

  /* 大气 Fresnel 光晕 */
  const atmosMat = new THREE.ShaderMaterial({
    uniforms:{ glowColor:{value:new THREE.Color(0x3fb8e6)} },
    vertexShader:`varying vec3 vN; varying vec3 vV;
      void main(){ vN = normalize(normalMatrix * normal);
        vV = normalize((modelViewMatrix * vec4(position,1.0)).xyz);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 glowColor; varying vec3 vN; varying vec3 vV;
      void main(){ float i = pow(1.0 - abs(dot(vN, -vV)), 2.8);
        gl_FragColor = vec4(glowColor, 1.0) * i; }`,
    side:THREE.BackSide, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false
  });

    new THREE.SphereGeometry(1.18, isMobile?96:160, isMobile?96:160), atmosMat);

function initStars(){

    const v = new THREE.Vector3().randomDirection().multiplyScalar(40 + Math.random()*30);
    pos.set([v.x,v.y,v.z], i*3);

    const c = new THREE.Color().setRGB(0.55+0.45*t, 0.62+0.38*t, 0.7+0.3*t);
    col.set([c.r,c.g,c.b], i*3);

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));

    transparent:true, opacity:0.8, depthWrite:false}));

}

/* 每帧根据相机距离与投影位置显隐标签（投影在视口内且朝向相机才显示） */
const lodProj = new THREE.Vector3();
function inObjectView(L){
  L.obj.getWorldPosition(lodProj);
  lodProj.project(camera);
  if(lodProj.z>1) return false;
  if(lodProj.x<-1.05||lodProj.x>1.05||lodProj.y<-1.05||lodProj.y>1.05) return false;
  return L.normal.dot(camera.position.clone().normalize())>0;
}
function updateLabelLOD(){
  const d=camera.position.length();
  const inLayer=!earthGroup.visible;
  const showCountry=d>=2.3, showCity=d<=2.6;
  countryLabelObjs.forEach(L=>{
    const vis=!inLayer && showCountry && inObjectView(L);
    if(L._vis!==vis){L.div.classList.toggle('hidden',!vis);L._vis=vis;}
  });
  cityLabelObjs.forEach(L=>{
    const vis=!inLayer && showCity && inObjectView(L);
    if(L._vis!==vis){L.div.classList.toggle('hidden',!vis);L._vis=vis;}
  });
  islandLabelObjs.forEach(L=>{

    if(L._vis!==vis){L.div.classList.toggle('hidden',!vis);L._vis=vis;}
  });
  const showFeature=d>=2.7;
  featureLabelObjs.forEach(L=>{
    const vis=!inLayer && showFeature && inObjectView(L);
    if(L._vis!==vis){L.div.classList.toggle('hidden',!vis);L._vis=vis;}
  });

  });
}/* 屏幕空间防重叠：可见国家标签矩形相交时，隐藏后出现的一个（在 CSS2D 渲染后调用） */
function resolveLabelOverlap(){
  document.querySelectorAll('.geo-label.occluded').forEach(el=>el.classList.remove('occluded'));
  const placed=[];
  for(const L of countryLabelObjs){
    const el=L.div;
    if(el.classList.contains('hidden'))continue;
    const r=el.getBoundingClientRect();
    /* 略微内缩，留出呼吸间距，避免边框相贴 */
    const a={left:r.left+2,right:r.right-2,top:r.top+2,bottom:r.bottom-2};
    if(r.width===0)continue;
    let hit=false;
    for(const p of placed){
      if(!(a.right<p.left||a.left>p.right||a.bottom<p.top||a.top>p.bottom)){hit=true;break;}
    }
    if(hit)el.classList.add('occluded');else placed.push(a);
  }
}

/* ============================================================
   图层一：气候带（Canvas 程序化纹理 + 纬线）
   ============================================================ */
function buildClimateTexture(){
  const cv = document.createElement('canvas');
  cv.width = 2048; cv.height = 1024;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const latToY = lat => (90 - lat) / 180 * H;
  ctx.clearRect(0,0,W,H);
  ctx.globalAlpha = 0.6;

  if(state.climateMode === 'belt'){
    CLIMATE_BELTS.forEach(b=>{
      ctx.fillStyle = b.color;
      const yHigh = latToY(b.latMax), yLow = latToY(b.latMin);
      /* 北半球 */
      ctx.fillRect(0, yHigh, W, yLow-yHigh);
      /* 南半球镜像 */
      ctx.fillRect(0, H-yLow, W, yLow-yHigh);
    });
  } else {
    CLIMATE_TYPES.forEach(t=>{
      ctx.fillStyle = t.color;
      [1,-1].forEach(sgn=>{
        const yA = latToY(t.latMax*sgn), yB = latToY(t.latMin*sgn);
        ctx.fillRect(0, Math.min(yA,yB), W, Math.abs(yA-yB));
      });
    });
  }
  /* 关键纬线亮线：赤道、回归线、极圈 */
  ctx.globalAlpha = 0.95;
  [ {lat:0,c:'#ffffff'},{lat:23.5,c:'#e6b25f'},{lat:-23.5,c:'#e6b25f'},
    {lat:66.5,c:'#9fd4ff'},{lat:-66.5,c:'#9fd4ff'} ].forEach(l=>{
    ctx.fillStyle = l.c;
    const y = latToY(l.lat);
    ctx.fillRect(0, y-1.5, W, 3);
  });
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

let climateGroup = null;
function createClimateLayer(){
  climateGroup = new THREE.Group();
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(1.003, 72, 72),

  climateGroup.add(mesh);
  /* 三维纬线环 */
  [ {lat:0,c:0xffffff},{lat:23.5,c:0xe6b25f},{lat:-23.5,c:0xe6b25f},
    {lat:66.5,c:0x9fd4ff},{lat:-66.5,c:0x9fd4ff} ].forEach(l=>{
    const pts = [];
    for(let lon=-180;lon<=180;lon+=3) pts.push(latLonToVec(l.lat,lon,1.006));
    const line = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:l.c, transparent:true, opacity:0.75}));

function rebuildClimate(){

}

/* ============================================================
   图层二：洋流（流动 Tube + 箭头 + 拾取）
   ============================================================ */
const currentMeshes = [];
const currentMaterials = [];
function currentShader(color){
  return new THREE.ShaderMaterial({
    uniforms:{ uColor:{value:new THREE.Color(color)}, uTime:{value:0} },
    vertexShader:`varying vec2 vUv;
      void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 uColor; uniform float uTime; varying vec2 vUv;
      void main(){
        float d = fract(vUv.x*5.0 - uTime*0.65);
        float pulse = smoothstep(0.0,0.18,d) * (1.0 - smoothstep(0.32,0.5,d));
        float edge = 0.55 + 0.45*sin(vUv.y*3.14159);
        gl_FragColor = vec4(uColor, (0.18 + pulse*0.82) * edge);
      }`,
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
  });
}
function createCurrentLayer(){
  currentGroup = new THREE.Group();
  OCEAN_CURRENTS.forEach((c,idx)=>{
    const pts = c.path.map(p=>latLonToVec(p[0],p[1],1.008));
    const curve = new THREE.CatmullRomCurve3(pts);
    const color = c.kind==='warm' ? 0xff7a4d : 0x53b7e8;
    const mat = currentShader(color);
    currentMaterials.push(mat);
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 120, 0.0048, 8, false), mat);
    tube.userData = {type:'current', idx};
    currentGroup.add(tube);
    currentMeshes.push(tube);
    /* 末端箭头 */
    const end = curve.getPointAt(1), tan = curve.getTangentAt(1);
    const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.016,0.045,12),
      new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.9}));
    arrow.position.copy(end);
    arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), tan);
    arrow.userData = {type:'current', idx};
    currentGroup.add(arrow);
    currentMeshes.push(arrow);
  });
  earthGroup.add(currentGroup);
  currentGroup.visible = false;
}
function updateCurrentFlow(dt){
  if(currentGroup && currentGroup.visible){
    currentMaterials.forEach(m=>m.uniforms.uTime.value += dt);
  }
}

/* ============================================================
   图层：板块构造与地震带（球面路径 Tube）
   ============================================================ */
/* 按日期变更线把路径拆成连续段，避免跨 ±180 经线画出穿球的线 */
function splitByDateline(path){
  const segs=[[]];
  for(let i=0;i<path.length;i++){
    if(i>0 && Math.abs(path[i][1]-path[i-1][1])>180) segs.push([]);
    segs[segs.length-1].push(path[i]);
  }
  return segs.filter(s=>s.length>=2);
}
/* 球面路径 → 一组 Tube mesh（自动处理日期线） */
function makeSurfaceTubes(path,color,surfR,tubeR,userData,segments=100){
  const out=[];
  for(const seg of splitByDateline(path)){
    const pts=seg.map(p=>latLonToVec(p[0],p[1],surfR));
    if(pts.length===2) pts.splice(1,0,pts[0].clone().add(pts[1]).multiplyScalar(.5).normalize().multiplyScalar(surfR));
    const curve=new THREE.CatmullRomCurve3(pts);
    const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95});
    const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,segments,tubeR,8,false),mat);
    mesh.userData=userData;
    out.push(mesh);
  }
  return out;
}
function createPlateLayer(){
  plateGroup=new THREE.Group();
  PLATE_BOUNDARIES.forEach((b,idx)=>{
    const color=BOUNDARY_TYPE[b.type].color;
    makeSurfaceTubes(b.path,color,1.011,0.0058,{type:'plateBoundary',idx})
      .forEach(t=>{plateGroup.add(t);plateMeshes.push(t);});
  });
  TECTONIC_PLATES.forEach((p,idx)=>{

}
function createQuakeLayer(){
  quakeGroup=new THREE.Group();
  SEISMIC_BELTS.forEach((belt,idx)=>{
    belt.paths.forEach(path=>{

      glow.forEach(t=>{t.material.opacity=.2;t.material.blending=THREE.AdditiveBlending;
        quakeGroup.add(t);quakeMeshes.push(t);});
      const core=makeSurfaceTubes(path,belt.color,1.015,0.0052,{type:'seismicBelt',idx},110);
      core.forEach(t=>{quakeGroup.add(t);quakeMeshes.push(t);});

/* ============================================================
   图层三：特色建筑标记（光柱 + 菱形 + 脉冲环）
   ============================================================ */
const markerMeshes = [];
const markerData = [];
let selectedMarker = -1, hoveredMarker = -1;
function makeGlowTexture(){
  const cv = document.createElement('canvas'); cv.width=128; cv.height=128;
  const c = cv.getContext('2d');
  const grad = c.createRadialGradient(64,64,0,64,64,64);
  grad.addColorStop(0,'rgba(255,255,255,1)');
  grad.addColorStop(0.3,'rgba(255,255,255,0.55)');
  grad.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=grad; c.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(cv);
}
function createLandmarkLayer(){
  landmarkGroup = new THREE.Group();
  const glowTex = makeGlowTexture();
  LANDMARKS.forEach((lm,idx)=>{
    const normal = latLonToVec(lm.lat, lm.lon, 1).normalize();
    const g = new THREE.Group();
    g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), normal);
    g.position.copy(normal);

    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.0045,0.0045,0.06,8),
      new THREE.MeshBasicMaterial({color:0x38d6bb, transparent:true, opacity:0.9}));
    pole.position.y = 0.03;
    const dia = new THREE.Mesh(new THREE.OctahedronGeometry(0.018),
      new THREE.MeshPhongMaterial({color:0x38d6bb, emissive:0x145047, shininess:70}));
    dia.position.y = 0.072;
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.022,0.027,32),
      new THREE.MeshBasicMaterial({color:0xe6b25f, transparent:true, opacity:0, side:THREE.DoubleSide}));
    ring.rotation.x = -Math.PI/2;
    ring.position.y = 0.004;
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,
      color:0x38d6bb, transparent:true, opacity:0.55, depthWrite:false, blending:THREE.AdditiveBlending}));
    glow.position.y = 0.072; glow.scale.set(0.055,0.055,1);
    [pole,dia,ring].forEach(m=>{ m.userData={type:'landmark',idx}; g.add(m); markerMeshes.push(m); });
    g.add(glow);
    landmarkGroup.add(g);
    markerData.push({group:g, dia, ring, glow, phase:Math.random()*Math.PI*2});
  });
  earthGroup.add(landmarkGroup);
  landmarkGroup.visible = false;
}
function updateMarkers(dt){
  if(!landmarkGroup || !landmarkGroup.visible) return;
  const t = clock.elapsedTime;
  markerData.forEach((md,idx)=>{
    if(idx===selectedMarker){
      const s = 1 + Math.sin(t*3.2)*0.18;
      md.dia.scale.setScalar(1.5*s);
      md.dia.material.color.setHex(0xe6b25f);
      md.dia.material.emissive.setHex(0x4a3208);
      const p = (t*0.5 + md.phase) % 1;
      md.ring.scale.setScalar(1 + p*2.2);
      md.ring.material.opacity = (1-p)*0.8;
      md.glow.material.color.setHex(0xe6b25f);
      md.glow.scale.set(0.09+0.02*s, 0.09+0.02*s, 1);
      md.glow.material.opacity = 0.9;
    } else {
      const hov = idx===hoveredMarker;
      md.dia.scale.setScalar(hov ? 1.35 : 1);
      md.dia.material.color.setHex(0x38d6bb);
      md.dia.material.emissive.setHex(0x0e3a34);
      md.ring.material.opacity = 0;
      md.glow.material.color.setHex(0x38d6bb);
      md.glow.scale.set(hov?0.075:0.055, hov?0.075:0.055, 1);
      md.glow.material.opacity = hov ? 0.85 : 0.55;
    }
  });
}

function createLayerGroup(){
  layerGroup = new THREE.Group();
  const intactY=[-0.72,-0.43,-0.14,0.15,0.44,0.73];
  EARTH_LAYERS.forEach((l,i)=>{
    const g = new THREE.Group();
    const r = l.vis;
    const emitFactor = [0.6,0.45,0.30,0.24,0.28,0.15][i];
    const op = [1,0.62,0.50,0.45,0.50,0.35][i];
    const mat = new THREE.MeshPhongMaterial({
      color:new THREE.Color(l.color),
      emissive:new THREE.Color(l.color).multiplyScalar(emitFactor),
      shininess:32, transparent:true, opacity:op, side:THREE.DoubleSide, depthWrite:false
    });
    const sphere = new THREE.Mesh(new THREE.SphereGeometry(r, i===5?72:48, i===5?72:48), mat);
    sphere.userData = {type:'layer',idx:i};
    g.add(sphere);
    const eqPts = [];
    for(let a=0;a<72;a++){
      const ang = a/72*Math.PI*2;
      eqPts.push(new THREE.Vector3(Math.cos(ang)*r, 0, Math.sin(ang)*r));
    }
    const ringCol = new THREE.Color(l.color).lerp(new THREE.Color(0xffffff), 0.55);
    g.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(eqPts),
      new THREE.LineBasicMaterial({color:ringCol, transparent:true, opacity:0.85})));
    const side=i%2?-1:1;
    const intactPos=new THREE.Vector3(side*1.18,intactY[i],0);
    const explodePos=new THREE.Vector3(side*0.38,0,0);
    const label = makeLayerLabel(`${l.name}\n${layerDepthText(l)}`,l.color);
    label.position.copy(intactPos);
    label.material.opacity=0.95;
    g.add(label);
    layerGroup.add(g);
    layerMeshes.push({group:g, label, index:i, intactPos, explodePos});
  });
  EARTH_INTERFACES.forEach(inf=>{
    const g=new THREE.Group();
    const eqPts=[];
    for(let a=0;a<72;a++){
      const ang=a/72*Math.PI*2;
      eqPts.push(new THREE.Vector3(Math.cos(ang)*inf.vis,0,Math.sin(ang)*inf.vis));
    }
    g.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(eqPts),
      new THREE.LineBasicMaterial({color:inf.color,transparent:true,opacity:0.95})));
    const label=makeLayerLabel(`${inf.name}\n地下 ${depthFromRadius(inf.radiusKm)} km`,inf.color,0.52,0.13);
    label.position.set(inf.radiusKm===3480?-0.55:0.55,inf.vis+0.12,0);
    label.material.opacity=1;
    g.add(label);
    layerGroup.add(g);
    interfaceMeshes.push({group:g,label});
  });

  const waveGroup=new THREE.Group();
  layerWaveGroup=waveGroup;
  waveSource=new THREE.Vector3(0,1,0);
  const pEnd=new THREE.Vector3(0,-1,0);
  const sEnd=new THREE.Vector3(0.22,0.31,0);

  const sourceMesh=new THREE.Mesh(new THREE.SphereGeometry(0.045,20,20),
    new THREE.MeshBasicMaterial({color:'#ffd25c'}));
  sourceMesh.position.copy(waveSource);
  const sourceLabel=makeLayerLabel('震源','#ffd25c',0.24,0.07);
  sourceLabel.position.set(0,1.13,0); sourceLabel.material.opacity=1;
  waveGroup.add(sourceMesh,sourceLabel);

  waveGroup.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([waveSource,pEnd]),
    new THREE.LineBasicMaterial({color:'#53d9a8',transparent:true,opacity:0.32})));
  for(let i=0;i<10;i++){
    const base=i/9;
    const dot=new THREE.Mesh(new THREE.SphereGeometry(0.018,14,14),
      new THREE.MeshBasicMaterial({color:'#53d9a8',transparent:true,opacity:0.95}));
    dot.position.set(-0.04,1-2*base,0);
    waveGroup.add(dot);
    pDots.push({mesh:dot,base});
  }
  function downArrow(){
    const cone=new THREE.Mesh(new THREE.ConeGeometry(0.035,0.09,16),
      new THREE.MeshBasicMaterial({color:'#53d9a8'}));
    cone.rotation.z=Math.PI;
    return cone;
  }
  [0.55,0.1,-0.35,-0.8].forEach(y=>{
    const a=downArrow();a.position.set(0.07,y,0);waveGroup.add(a);
  });
  const pLabel=makeLayerLabel('纵波 P\n振动∥传播，可穿过外核','#53d9a8',0.52,0.13);
  pLabel.position.set(0.58,0.55,0);pLabel.material.opacity=1;
  waveGroup.add(pLabel);

  waveGroup.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([waveSource,sEnd]),
    new THREE.LineBasicMaterial({color:'#ff8a5c',transparent:true,opacity:0.32})));
  const sDir=sEnd.clone().sub(waveSource);
  const sUnit=sDir.clone().normalize();
  const sPerp=new THREE.Vector3(-sUnit.y,sUnit.x,0);
  sWaveMeta={dir:sDir,unit:sUnit,perp:sPerp,end:sEnd};
  const SEG=80;
  sWaveGeo=new THREE.BufferGeometry();
  sWaveGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array((SEG+1)*3),3));
  waveGroup.add(new THREE.Line(sWaveGeo,
    new THREE.LineBasicMaterial({color:'#ff8a5c',transparent:true,opacity:0.95})));
  const stopRing=new THREE.Mesh(new THREE.TorusGeometry(0.05,0.006,8,32),
    new THREE.MeshBasicMaterial({color:'#ff5252'}));
  stopRing.position.copy(sEnd);
  sPacket=new THREE.Mesh(new THREE.SphereGeometry(0.028,16,16),
    new THREE.MeshBasicMaterial({color:'#ff8a5c'}));
  sPacket.position.copy(waveSource).addScaledVector(sDir,0.5);
  const sLabel=makeLayerLabel('横波 S\n振动⊥传播，止于古登堡面','#ff8a5c',0.56,0.13);
  sLabel.position.set(-0.72,0.58,0);sLabel.material.opacity=1;
  waveGroup.add(stopRing,sPacket,sLabel);
  layerGroup.add(waveGroup);
  buildSWave(0);

  scene.add(layerGroup);
  layerGroup.visible = false;
}
function buildSWave(phase){
  if(!sWaveGeo||!sWaveMeta||!waveSource)return;
  const arr=sWaveGeo.attributes.position.array, SEG=80;
  for(let j=0;j<=SEG;j++){
    const t=j/SEG;
    const p=waveSource.clone().addScaledVector(sWaveMeta.dir,t);
    p.addScaledVector(sWaveMeta.perp,Math.sin(t*7*Math.PI+phase)*0.028);
    arr[j*3]=p.x;arr[j*3+1]=p.y;arr[j*3+2]=p.z;
  }
  sWaveGeo.attributes.position.needsUpdate=true;
}
function updateLayerWaves(dt){
  if(!layerGroup||!layerGroup.visible)return;
  wavePhase=reducedMotion?0:wavePhase+dt*3.4;
  pDots.forEach(d=>{
    const t=(d.base+0.035*Math.sin(wavePhase+d.base*Math.PI*2)+1)%1;
    d.mesh.position.set(-0.04,1-2*t,0);
  });
  buildSWave(wavePhase);
  sPacketT=reducedMotion?0.5:(sPacketT+dt*0.45)%1;
  if(sPacket)sPacket.position.copy(waveSource).addScaledVector(sWaveMeta.dir,sPacketT);
}
function setExplode(v){
  explodeAmt = v;
  const SPACING = 0.42;
  const n=layerMeshes.length;
  layerMeshes.forEach((m,i)=>{
    m.group.position.y = v * (i - (n-1)/2) * SPACING;
    m.label.position.lerpVectors(m.intactPos,m.explodePos,v);
    m.label.material.opacity = 0.95;
  });
  if(layerWaveGroup) layerWaveGroup.visible = false; // 波演示已拆分至独立「地震波」板块
  interfaceMeshes.forEach(im=>{ im.group.visible = v < 0.15; });
}

function makePlanetTexture(p){
  const c=document.createElement('canvas');c.width=256;c.height=128;
  const x=c.getContext('2d');
  x.fillStyle=p.color;x.fillRect(0,0,256,128);
  if(p.band){
    const cols=['#00000022','#ffffff22','#00000030','#ffffff18','#00000025'];
    for(let i=0;i<14;i++){x.fillStyle=cols[i%cols.length];
      x.fillRect(0,i*9+2,256,4+(i%3)*2);}
  } else {
    for(let i=0;i<260;i++){
      const w=Math.random()<.5?'#00000020':'#ffffff18';
      x.fillStyle=w;x.beginPath();
      x.arc(Math.random()*256,Math.random()*128,Math.random()*2.2+0.4,0,7);x.fill();
    }
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;
}

    const pts=[];
    for(let a=0;a<128;a++){const ang=a/128*Math.PI*2;
      pts.push(new THREE.Vector3(Math.cos(ang)*p.orbit,0,Math.sin(ang)*p.orbit));}
    solarSystemGroup.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:0x6fa8c9,transparent:true,opacity:.32})));
    const mat=p.earth
      ? new THREE.MeshPhongMaterial({color:0x4f86c6,emissive:0x0a1a2a,shininess:18})
      : new THREE.MeshPhongMaterial({map:makePlanetTexture(p),shininess:14});
    const body=new THREE.Mesh(
      new THREE.SphereGeometry(p.size,isMobile?40:48,isMobile?40:48),mat);
    body.position.set(p.orbit,0,0);
    body.userData={type:'solarBody',idx:i};
    pivot.add(body);
    if(p.ring){
      const ringMesh=new THREE.Mesh(new THREE.RingGeometry(p.size*1.4,p.size*2.3,64),
        new THREE.MeshBasicMaterial({color:0xd9c79a,side:THREE.DoubleSide,
          transparent:true,opacity:.75}));
      ringMesh.rotation.x=Math.PI/2.3;body.add(ringMesh);
    }
    /* 行星名称标签（跟随行星，在其上方） */
    const plabel=makeSolarLabel(p.name);
    plabel.position.set(0,p.size+0.2,0);body.add(plabel);solarLabelObjs.push(plabel);

    /* 地月系：月球绕地球 */
    if(p.earth){
      const moonPivot=new THREE.Group();body.add(moonPivot);
      const moon=new THREE.Mesh(new THREE.SphereGeometry(0.065,20,20),
        new THREE.MeshPhongMaterial({color:0xd2d2d2,shininess:8}));
      moon.position.set(0.36,0,0);
      moon.userData={type:'solarBody',idx:100};
      moonPivot.add(moon);
      const ml=makeSolarLabel('月球');ml.position.set(0,0.13,0);moon.add(ml);solarLabelObjs.push(ml);
      moonObj={pivot:moonPivot,moon,angle:0};
    }
    solarPlanetObjs.push({pivot,body,p,angle:Math.random()*Math.PI*2});
  });

  /* 小行星带：火星(5.2)与木星(7.0)之间 */
  const N=420,pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r=5.95+Math.random()*0.75,a=Math.random()*Math.PI*2;
    pos[i*3]=Math.cos(a)*r;pos[i*3+1]=(Math.random()-.5)*0.16;pos[i*3+2]=Math.sin(a)*r;
  }
  const ag=new THREE.BufferGeometry();ag.setAttribute('position',new THREE.BufferAttribute(pos,3));
  asteroidBelt=new THREE.Points(ag,new THREE.PointsMaterial({color:0xb0a07e,size:0.05,
    transparent:true,opacity:.82,depthWrite:false}));
  solarSystemGroup.add(asteroidBelt);

  scene.add(solarSystemGroup);
  solarSystemGroup.visible=false;
  /* 初始为地球视图：名称标签默认隐藏，进入太阳系时再恢复 */
  solarLabelObjs.forEach(o=>o.visible=false);
}

/* ============================================================
   太阳结构拆解组（嵌套球 + 对称爆炸）
   ============================================================ */
const SUN_VIS_BASE=0.85;
function createSunLayerGroup(){
  sunLayerGroup=new THREE.Group();
  SUN_LAYERS.forEach((l,i)=>{
    const g=new THREE.Group();
    const r=l.r*SUN_VIS_BASE;
    const mat=new THREE.MeshPhongMaterial({
      color:new THREE.Color(l.color),
      emissive:new THREE.Color(l.color).multiplyScalar(0.42),
      shininess:26,transparent:true,opacity:i<3?0.92:0.4,side:THREE.DoubleSide,depthWrite:false});
    const sphere=new THREE.Mesh(
      new THREE.SphereGeometry(r,isMobile?48:64,isMobile?48:64),mat);
    sphere.userData={type:'sunLayer',idx:i};
    g.add(sphere);
    /* 边界环 */
    const ep=[];
    for(let a=0;a<72;a++){const ang=a/72*Math.PI*2;
      ep.push(new THREE.Vector3(Math.cos(ang)*r,0,Math.sin(ang)*r));}
    const rc=new THREE.Color(l.color).lerp(new THREE.Color(0xffffff),0.5);
    g.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(ep),
      new THREE.LineBasicMaterial({color:rc,transparent:true,opacity:.8})));
    /* 标签 */
    const cv=document.createElement('canvas');cv.width=512;cv.height=128;
    const cx=cv.getContext('2d');
    cx.fillStyle='rgba(8,15,24,.82)';cx.fillRect(0,0,512,128);
    cx.strokeStyle=l.color;cx.lineWidth=4;cx.strokeRect(4,4,504,120);
    cx.fillStyle='#e7eff6';cx.font='600 50px sans-serif';cx.textAlign='center';
    cx.fillText(l.name,256,80);
    const label=new THREE.Sprite(new THREE.SpriteMaterial({
      map:new THREE.CanvasTexture(cv),transparent:true,opacity:0,depthWrite:false,depthTest:false}));
    label.scale.set(0.42,0.105,1);label.position.y=r+0.1;
    g.add(label);
    sunLayerGroup.add(g);
    sunLayerMeshes.push({group:g,label,index:i});
  });
  scene.add(sunLayerGroup);sunLayerGroup.visible=false;
}
function setSunExplode(v){
  sunExplodeAmt=v;const SPACING=0.42;
  sunLayerMeshes.forEach((m,i)=>{
    m.group.position.y=v*(i-2.5)*SPACING;
    m.label.material.opacity=v>0.12?Math.min(1,(v-0.12)*2.2):0;
  });
}
function enterSunLayerMode(){
  sunLayerMode=true;
  solarSystemGroup.visible=false;
  solarLabelObjs.forEach(o=>o.visible=false);
  sunLayerGroup.visible=true;
  controls.minDistance=1.4;controls.maxDistance=16;
  moveCamera([0,0.6,7.6],1.4);
}
function exitSunLayerMode(){
  sunLayerMode=false;
  sunLayerGroup.visible=false;
  solarSystemGroup.visible=true;
  solarLabelObjs.forEach(o=>o.visible=true);
  controls.minDistance=1.6;controls.maxDistance=26;
  moveCamera([0,7.4,15.4],1.4);
}

/* 行星公转、月球公转与小行星带旋转 */
function updateSolarOrbits(dt){
  if(!solarSystemGroup||!solarSystemGroup.visible)return;
  if(!solarPaused){
    const base=dt*0.28*solarSpeed;
    solarPlanetObjs.forEach(o=>{
      o.angle+=base*o.p.speed;
      o.pivot.rotation.y=o.angle;
      o.body.rotation.y+=dt*0.5;
    });
    if(moonObj){moonObj.angle+=dt*1.4*solarSpeed;moonObj.pivot.rotation.y=moonObj.angle;}
    if(asteroidBelt)asteroidBelt.rotation.y+=dt*0.06*solarSpeed;
  }
  updateSolarActivity(dt);
}
/* 太阳活动标记脉动（黑子微闪、耀斑明暗） */
function updateSolarActivity(dt){
  const t=clock.elapsedTime;
  sunActivityMarkers.forEach((m,i)=>{
    const pulse=1+Math.sin(t*2.4+i*1.7)*0.18;
    m.scale.setScalar(pulse);
  });
}

/* 进入 / 退出太阳系模式 */
function enterSolarMode(){
  earthGroup.visible=false;atmosphere.visible=false;
  if(climateGroup)climateGroup.visible=false;
  if(currentGroup)currentGroup.visible=false;
  if(landmarkGroup)landmarkGroup.visible=false;
  if(layerGroup)layerGroup.visible=false;
  solarSystemGroup.visible=true;
  /* CSS2D 不随父级显隐，进入时恢复名称标签（太阳结构模式除外） */
  if(!sunLayerMode)solarLabelObjs.forEach(o=>o.visible=true);
  controls.minDistance=1.6;controls.maxDistance=26;
  moveCamera([0,7.4,15.4],1.5);
}
function exitSolarMode(){
  solarSystemGroup.visible=false;
  /* 切回地球：手动隐藏全部太阳系名称标签，避免残留悬浮 */
  solarLabelObjs.forEach(o=>o.visible=false);
  earthGroup.visible=true;atmosphere.visible=true;
  controls.minDistance=1.32;controls.maxDistance=6;
  moveCamera([DEFAULT_CAMERA.x,DEFAULT_CAMERA.y,DEFAULT_CAMERA.z],1.3);
}

/* 带目标点的相机飞行（用于日食月食演示） */
const CAM_EASE='power3.inOut';
function flyToTarget(pos,tgt,dur){
  state.flying=true;controls.enabled=false;
  if(window.gsap&&!reducedMotion){
    gsap.killTweensOf(camera.position);
    gsap.killTweensOf(controls.target);
    gsap.timeline({onComplete(){state.flying=false;controls.enabled=true;}})
      .to(controls.target,{x:tgt.x,y:tgt.y,z:tgt.z,duration:dur,ease:CAM_EASE},0)
      .to(camera.position,{x:pos[0],y:pos[1],z:pos[2],duration:dur,ease:CAM_EASE},0);
  }else{camera.position.set(pos[0],pos[1],pos[2]);controls.target.copy(tgt);
    state.flying=false;controls.enabled=true;}
}
/* 日食/月食位置演示 */
function demoEclipse(type){
  if(sunLayerMode)exitSunLayerMode();
  solarPaused=true;
  const earthO=solarPlanetObjs[2];
  earthO.angle=0;earthO.pivot.rotation.y=0;
  if(type==='solar'){
    moonObj.angle=Math.PI;moonObj.pivot.rotation.y=Math.PI;
    flyToTarget([4.05,0.5,1.7],new THREE.Vector3(4.2,0,0),1.3);
  }else{
    moonObj.angle=0;moonObj.pivot.rotation.y=0;
    flyToTarget([4.8,0.75,1.9],new THREE.Vector3(4.56,0,0),1.3);
  }
}

/* ============================================================
   相机飞行
   ============================================================ */
function flyTo(lat, lon, dist){
  const d = dist || (isMobile ? 2.0 : 1.85);
  const target = latLonToVec(lat,lon,d);
  state.flying = true;
  controls.enabled = false;
  if(window.gsap && !reducedMotion){
    /* 按当前到目标的距离动态定时长，短距离不拖沓、长距离不仓促 */
    const gap=camera.position.distanceTo(target);
    const dur=Math.min(1.8,Math.max(0.9,gap*0.42));
    gsap.killTweensOf(camera.position);
    gsap.to(camera.position,{x:target.x,y:target.y,z:target.z,duration:dur,
      ease:CAM_EASE,
      onComplete:()=>{state.flying=false;controls.target.set(0,0,0);controls.enabled=true;}});
  } else {
    camera.position.copy(target);
    controls.target.set(0,0,0);
    state.flying=false; controls.enabled=true;
  }
}

function updateSunReadout(){
  const n=state.dayOfYear, dec=updateSun(n);
  const md=dayToMonthDay(n), term=currentTerm(n);
  const dateEl=$('sunDate'); if(dateEl) dateEl.textContent=`${md.month}月${md.day}日`;
  const termEl=$('sunTerm'); if(termEl) termEl.textContent=term.name;
  const decEl=$('sunDec');
  if(decEl){
    const abs=Math.abs(dec).toFixed(2);
    decEl.textContent = Math.abs(dec)<0.05 ? '0°（赤道）' :
      `${abs}°${dec>0?'N':'S'}`;
  }
  /* 滑块填充与节气按钮高亮 */
  const slider=$('sunSlider');
  if(slider){
    slider.value=n;
    slider.style.background=`linear-gradient(to right,var(--amber) 0%,var(--amber) ${(n/365*100).toFixed(1)}%,rgba(132,172,206,.2) ${(n/365*100).toFixed(1)}%)`;
  }
  document.querySelectorAll('.sun-term-btn').forEach(b=>{
    const on=+b.dataset.term===n;
    b.style.background=on?'var(--amber)':'rgba(255,255,255,.03)';
    b.style.color=on?'#1a1206':'var(--muted)';

  });
  /* 昼夜长短表 */

    {label:'赤道 0°',lat:0},{label:'北回归线 23.5°N',lat:23.5},
    {label:'北极圈 66.5°N',lat:66.5},{label:'南极圈 66.5°S',lat:-66.5}];
  const tb=$('sunDayRows');
  if(tb){
    tb.innerHTML=rows.map(r=>{
      const dl=dayLength(r.lat,dec), nl=24-dl;
      const dlTxt=dl>=24?'极昼':dl<=0?'极夜':fmtHour(dl);
      const nlTxt=nl>=24?'极夜':nl<=0?'极昼':fmtHour(nl);
      return `<tr><td>${r.label}</td><td class="num">${dlTxt}</td><td class="num">${nlTxt}</td></tr>`;
    }).join('');
  }
  const ex=$('sunExplain');
  if(ex){
    let hint='';
    if(Math.abs(dec)<0.05) hint='太阳直射赤道，全球昼夜等长，各为 12 小时，为春分或秋分。';
    else if(dec>23) hint='太阳直射北回归线附近，北半球昼最长夜最短、北极圈内极昼，为夏至；南半球相反。';
    else if(dec<-23) hint='太阳直射南回归线附近，北半球昼最短夜最长、北极圈内极夜，为冬至；南半球相反。';
    else hint=dec>0?'直射点位于北半球并向北/南移动，北半球昼长夜短，为夏半年。':'直射点位于南半球，北半球昼短夜长，为冬半年。';
    ex.textContent=hint;
  }
  renderSunOverview();
}

function syncOverview(){
  /* 除太阳系（离开地球场景）外，其余地球图层都保留直射点概况图 */
