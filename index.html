function setupOverview(){
  const ov=$('sunOverview'), head=$('soToggle'), lockBtn=$('soLock');
  if(!ov) return;
  const compact = window.innerWidth<768 && matchMedia('(orientation:portrait)').matches;
  ov.classList.toggle('collapsed', compact);
  if(head) head.setAttribute('aria-expanded', String(!compact));

  /* ---------- 位置持久化与锁定状态 ---------- */
  const POS_KEY='geo_sun_pos_v1', LOCK_KEY='geo_sun_lock_v1';
  let locked=false;
  try{ locked = localStorage.getItem(LOCK_KEY)==='1'; }catch(e){}

  const paintLock=()=>{
    ov.classList.toggle('locked', locked);
    if(lockBtn){
      lockBtn.setAttribute('aria-pressed', String(locked));
      lockBtn.title = locked ? '已锁定 · 点击解锁' : '锁定位置';
      lockBtn.setAttribute('aria-label', locked ? '解锁概况图位置' : '锁定概况图位置');
    }
    if(head) head.setAttribute('aria-label', locked
      ? '太阳直射点概况：点击折叠（位置已锁定）'
      : '太阳直射点概况：点击折叠，按住可拖动');
  };
  const clampPos=(l,t)=>{
    const w=ov.offsetWidth||252, h=ov.offsetHeight||140, m=8;
    const maxL=Math.max(m, window.innerWidth-w-m);
    const maxT=Math.max(m, window.innerHeight-h-m);
    return [Math.round(Math.min(Math.max(l,m),maxL)), Math.round(Math.min(Math.max(t,m),maxT))];
  };
  const place=(l,t,persist)=>{
    const [cl,ct]=clampPos(l,t);
    ov.classList.add('placed','moved');
    ov.style.right='auto'; ov.style.bottom='auto';
    ov.style.left=cl+'px'; ov.style.top=ct+'px';
    if(persist){ try{ localStorage.setItem(POS_KEY, JSON.stringify({l:cl,t:ct})); }catch(e){} }
  };
  const resetPos=(quiet)=>{
    ov.classList.remove('placed','moved','dragging');
    ov.style.left=''; ov.style.top=''; ov.style.right=''; ov.style.bottom='';
    try{ localStorage.removeItem(POS_KEY); }catch(e){}
    if(!quiet && typeof toast==='function') toast('概况图位置已复位');
  };
  try{
    const raw=localStorage.getItem(POS_KEY);
    if(raw){
      const p=JSON.parse(raw);
      if(p && typeof p.l==='number' && typeof p.t==='number') place(p.l,p.t,false);
    }
  }catch(e){}

  const setLock=(v,quiet)=>{
    locked=!!v; paintLock();
    try{ localStorage.setItem(LOCK_KEY, locked?'1':'0'); }catch(e){}
    if(!quiet && typeof toast==='function') toast(locked?'位置已锁定，无法拖动':'位置已解锁，可自由拖动');
  };
  paintLock();
  if(lockBtn){
    lockBtn.addEventListener('pointerdown',e=>e.stopPropagation());
    lockBtn.addEventListener('click',e=>{ e.stopPropagation(); setLock(!locked); });
  }

  /* ---------- 折叠展开 ---------- */
  let suppressClick=false;
  if(head){
    head.addEventListener('click',e=>{
      if(e.target.closest('#soLock')) return;
      if(suppressClick){ suppressClick=false; return; }
      const c=ov.classList.toggle('collapsed');
      head.setAttribute('aria-expanded', String(!c));
    });
    head.addEventListener('keydown',e=>{
      if(e.key!=='Enter' && e.key!==' ' && e.key!=='Spacebar') return;
      if(e.target!==head) return;
      e.preventDefault();
      const c=ov.classList.toggle('collapsed');
      head.setAttribute('aria-expanded', String(!c));
    });
  }

  /* ---------- 按住拖动 ---------- */
  let drag=null, hintAt=0;
  if(head){
    head.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse' && e.button!==0) return;
      if(e.target.closest('#soLock')) return;
      const r=ov.getBoundingClientRect();
      drag={id:e.pointerId,x:e.clientX,y:e.clientY,l:r.left,t:r.top,moved:false};
      try{ head.setPointerCapture(e.pointerId); }catch(err){}
    });
    head.addEventListener('pointermove',e=>{
      if(!drag || e.pointerId!==drag.id) return;
      const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
      if(!drag.moved){
        if(Math.abs(dx)+Math.abs(dy)<6) return;
        drag.moved=true;
        if(locked){
          if(Date.now()-hintAt>2400){
            hintAt=Date.now();
            if(typeof toast==='function') toast('位置已锁定，点锁图标解锁后可拖动');
          }
          suppressClick=true;
          setTimeout(()=>{ suppressClick=false; }, 420);
          return;
        }
        ov.classList.add('dragging');
      }
      if(locked) return;
      place(drag.l+dx, drag.t+dy, false);
    });
    const endDrag=e=>{
      if(!drag || (e && e.pointerId!==drag.id)) return;
      const moved=drag.moved && !locked;
      drag=null;
      ov.classList.remove('dragging');
      if(moved){
        const l=parseFloat(ov.style.left), t=parseFloat(ov.style.top);
        if(isFinite(l) && isFinite(t)) place(l,t,true);
        suppressClick=true;
        setTimeout(()=>{ suppressClick=false; }, 420);
      }
    };
    head.addEventListener('pointerup',endDrag);
    head.addEventListener('pointercancel',endDrag);
    head.addEventListener('lostpointercapture',endDrag);
    /* 双击标题：位置复位到默认停靠点 */
    head.addEventListener('dblclick',e=>{
      if(e.target.closest('#soLock')) return;
      if(!ov.classList.contains('placed')) return;
      resetPos(false);
    });
  }

  /* ---------- 尺寸变化时不出视野 ---------- */
  window.addEventListener('resize',()=>{
    if(!ov.classList.contains('placed')) return;
    const l=parseFloat(ov.style.left), t=parseFloat(ov.style.top);
    if(isFinite(l) && isFinite(t)) place(l,t,true);
  });
}
/* ============ 沉浸式调节：拖滑条时隐去全部界面，只留调节条 ============ */
function setupAdjustFocus(){
  const view=$('adjustFocus'), slider=$('afSlider'), fill=$('afFill'), knob=$('afKnob');
  const labelEl=$('afLabel'), valEl=$('afVal'), iconEl=$('afIcon'), track=$('afTrack');
  if(!view||!slider||!track) return;

  const META={
    rotSens:{label:'滑动灵敏度',icon:'rotate',fmt:v=>v.toFixed(2)},
    zoomSens:{label:'缩放灵敏度',icon:'zoom',fmt:v=>v.toFixed(2)},
    explodeSlider:{label:'圈层拆解',icon:'layers',fmt:v=>Math.round(v)+'%'}
  };
  const ICONS={
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    rotate:'<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>',
    zoom:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M11 8v6M8 11h6"/>',
    layers:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="2"/>'
  };
  let active=null, dragId=null, hideTimer=null, lastIcon='', dragBase=null;

  function metaOf(input){
    return META[input.id]||{label:input.dataset.hudLabel||'调节',icon:'sun',fmt:v=>String(Math.round(v))};
  }
  function paint(input){
    const meta=metaOf(input);
    const min=+input.min||0, max=(input.max===''?100:+input.max)||100;
    const pct=max>min?Math.max(0,Math.min(1,(+input.value-min)/(max-min))):1;
    if(labelEl) labelEl.textContent=meta.label;
    if(valEl) valEl.textContent=meta.fmt(+input.value);
    if(fill) fill.style.width=(pct*100).toFixed(2)+'%';
    if(knob) knob.style.left=(pct*100).toFixed(2)+'%';
    if(iconEl && meta.icon!==lastIcon){
      lastIcon=meta.icon;
      iconEl.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+(ICONS[meta.icon]||ICONS.sun)+'</svg>';
    }
    slider.setAttribute('aria-valuenow',String(Math.round(pct*100)));
    slider.setAttribute('aria-valuetext',meta.fmt(+input.value));
    slider.setAttribute('aria-label',meta.label);
  }
  function applyValue(v){
    if(!active) return;
    const min=+active.min||0, max=(active.max===''?100:+active.max)||100;
    const step=(+active.step)||((max-min)/100);
    v=Math.round(v/step)*step;
    v=Math.min(max,Math.max(min,parseFloat(v.toFixed(6))));
    if(Math.abs(+active.value-v)>1e-9){
      active.value=v;
      active.dispatchEvent(new Event('input',{bubbles:true}));
    }
    paint(active);
  }
  /* 直接按在调节条上：绝对定位 */
  function setFromX(x){
    if(!active) return;
    const r=track.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(x-r.left)/(r.width||1)));
    const min=+active.min||0, max=(active.max===''?100:+active.max)||100;
    applyValue(min+pct*(max-min));
  }
  /* 从原控件上按住：按位移相对调节，避免松手瞬间数值跳变 */
  function moveRelative(x){
    if(!active||!dragBase) return;
    const min=+active.min||0, max=(active.max===''?100:+active.max)||100;
    const w=track.getBoundingClientRect().width||1;
    applyValue(dragBase.val+((x-dragBase.x)/w)*(max-min));
  }
  function show(input){
    active=input; lastIcon=''; paint(input);
    clearTimeout(hideTimer);
    view.classList.add('on');
    view.setAttribute('aria-hidden','false');
    document.body.classList.add('adjust-mode');
    try{ slider.focus({preventScroll:true}); }catch(err){}
    /* 关掉可能开着的提示，避免恢复后被挡住 */
    const tt=$('tooltip'); if(tt) tt.classList.remove('show');
  }
  function hide(delay){
    clearTimeout(hideTimer);
    hideTimer=setTimeout(()=>{
      view.classList.remove('on');
      view.setAttribute('aria-hidden','true');
      document.body.classList.remove('adjust-mode');
      active=null; dragId=null; dragBase=null;
    }, delay==null?700:delay);
  }
  const asRange=el=> (el && el.matches && el.matches('input[type=range]')) ? el : null;

  /* 从真实滑条上"接管"拖动：阻止原生拖动，改为驱动沉浸式调节条 */
  document.addEventListener('pointerdown',e=>{
    const input=asRange(e.target); if(!input) return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    e.preventDefault();
    show(input);
    dragId=e.pointerId;
    dragBase={x:e.clientX,val:+input.value};
    paint(active);
  },true);

  slider.addEventListener('pointerdown',e=>{
    if(!active) return;
    e.preventDefault();
    dragId=e.pointerId;
    dragBase=null;
    setFromX(e.clientX);
  });

  window.addEventListener('pointermove',e=>{
    if(dragId===null || e.pointerId!==dragId) return;
    if(dragBase) moveRelative(e.clientX); else setFromX(e.clientX);
  });
  ['pointerup','pointercancel'].forEach(t=>window.addEventListener(t,e=>{
    if(dragId===null || e.pointerId!==dragId) return;
    dragId=null; dragBase=null;
    if(active) hide(700);
  }));

  view.addEventListener('pointerdown',e=>{ if(e.target===view && active) hide(0); });

  slider.addEventListener('keydown',e=>{
    if(!active) return;
    const dir={'ArrowRight':1,'ArrowUp':1,'ArrowLeft':-1,'ArrowDown':-1}[e.key];
    if(dir){
      e.preventDefault();
      const min=+active.min||0, max=(active.max===''?100:+active.max)||100;
      const step=(+active.step)||((max-min)/100);
      active.value=Math.min(max,Math.max(min,(+active.value)+dir*step));
      active.dispatchEvent(new Event('input',{bubbles:true}));
      paint(active); hide(900);
    }else if(e.key==='Escape'){ e.preventDefault(); hide(0); }
  });
}

/* 侧视地球：按直射纬度标出直射点、赤道与南北回归线 */
function renderSoEarth(dec){
  const svg=$('soEarth'); if(!svg) return;
  const Cx=96,Cy=66,R=46, rad=dec*Math.PI/180, tR=23.44*Math.PI/180;
  const yN=Cy-R*Math.sin(tR), yS=Cy+R*Math.sin(tR);
  const Px=Cx+R*Math.cos(rad), Py=Cy-R*Math.sin(rad);
  const sunX=216, sunY=66;
  svg.innerHTML=`
   <line x1="${Cx}" y1="${Cy-R-8}" x2="${Cx}" y2="${Cy+R+8}" stroke="#5d7186" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>
   <circle cx="${Cx}" cy="${Cy}" r="${R}" fill="rgba(56,214,187,.07)" stroke="#7d8fa3" stroke-width="1.2"/>
   <line x1="${Cx-R}" y1="${yN}" x2="${Cx+R}" y2="${yN}" stroke="#7d8fa3" stroke-width="1" stroke-dasharray="4 3" opacity=".8"/>
   <line x1="${Cx-R}" y1="${Cy}" x2="${Cx+R}" y2="${Cy}" stroke="#8fd0ff" stroke-width="1" opacity=".55"/>
   <line x1="${Cx-R}" y1="${yS}" x2="${Cx+R}" y2="${yS}" stroke="#7d8fa3" stroke-width="1" stroke-dasharray="4 3" opacity=".8"/>
   <text x="4" y="${yN+3}" font-size="8.5" fill="#5d7186">北回归线</text>
   <text x="4" y="${Cy+3}" font-size="8.5" fill="#8fd0ff">赤道</text>
   <text x="4" y="${yS+3}" font-size="8.5" fill="#5d7186">南回归线</text>
   <line x1="${sunX-14}" y1="${sunY}" x2="${Px+3}" y2="${Py}" stroke="#e6b25f" stroke-width="1.2" opacity=".7"/>
   <circle cx="${sunX}" cy="${sunY}" r="12" fill="rgba(230,178,95,.16)" stroke="#e6b25f" stroke-width="1.2"/>
   <circle cx="${sunX}" cy="${sunY}" r="5" fill="#ffd25c"/>

   <circle cx="${Px.toFixed(1)}" cy="${Py.toFixed(1)}" r="4.5" fill="#ffd27a" stroke="#ffb24d" stroke-width="1.2"/>

/* 周年移动曲线：赤纬随年积日的往返，标出二分二至与当前位置 */
function renderSoCurve(n,dec){
  const svg=$('soCurve'); if(!svg) return;
  const x0=14,x1=236,yTop=14,yMid=39,yBot=64;
  const xm=k=>x0+(k-1)/364*(x1-x0);
  const ym=d=>yMid-d/23.44*(yMid-yTop);
  const pts=[];
  for(let k=1;k<=365;k+=4) pts.push(`${xm(k).toFixed(1)},${ym(solarDeclination(k)).toFixed(1)}`);
  const terms=KEY_TERMS.map(t=>{
    const tx=xm(t.n), ty=ym(solarDeclination(t.n));
    return `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="3" fill="#7d8fa3"/>
      <text x="${tx.toFixed(1)}" y="75" font-size="8.5" fill="#5d7186" text-anchor="middle">${t.label}</text>`;
  }).join('');
  const cx=xm(n), cy=ym(dec);
  svg.innerHTML=`
   <line x1="${x0}" y1="${yTop}" x2="${x1}" y2="${yTop}" stroke="#7d8fa3" stroke-width="1" stroke-dasharray="4 3" opacity=".6"/>
   <line x1="${x0}" y1="${yMid}" x2="${x1}" y2="${yMid}" stroke="#8fd0ff" stroke-width="1" stroke-dasharray="4 3" opacity=".5"/>
   <line x1="${x0}" y1="${yBot}" x2="${x1}" y2="${yBot}" stroke="#7d8fa3" stroke-width="1" stroke-dasharray="4 3" opacity=".6"/>
   <text x="${x0+2}" y="${yTop-3}" font-size="8.5" fill="#5d7186">23.5°N</text>
   <text x="${x0+2}" y="${yBot+11}" font-size="8.5" fill="#5d7186">23.5°S</text>
   <polyline points="${pts.join(' ')}" fill="none" stroke="#53d9a8" stroke-width="1.6" opacity=".9"/>
   ${terms}
   <line x1="${cx.toFixed(1)}" y1="${yTop}" x2="${cx.toFixed(1)}" y2="${yBot}" stroke="#e6b25f" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/>
   <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="5" fill="#ffd27a" stroke="#ffb24d" stroke-width="1.4"/>`;
}

function wvSeismogram(){
  const base=74, left=24, right=324;
  const pts=[];
  for(let x=left;x<=right;x+=4){
    let amp=2, y=base;
    if(x<88){ amp=2.5; }
    else if(x<138){ amp=7; }
    else if(x<168){ amp=2; }
    else if(x<220){ amp=13; }
    else { const d=(x-220)/(right-220); amp=26*(1-d*0.7); }
    const n=Math.sin(x*0.35)*0.6+Math.sin(x*0.9)*0.4;
    y=base+n*amp;
    pts.push(`${x},${y.toFixed(1)}`);
  }
  const ticks=[{x:88,c:'#53d9a8',t:'P 纵波'},{x:168,c:'#ff8a5c',t:'S 横波'},{x:220,c:'#b58cff',t:'面波'}];
  return `<div class="wv-seismo"><svg viewBox="0 0 340 132" role="img" aria-label="地震仪记录到的纵波横波面波到达顺序">
    <line x1="${left}" y1="${base}" x2="${right}" y2="${base}" stroke="#3a4d5e" stroke-width="1"/>
    ${ticks.map(k=>`<line x1="${k.x}" y1="20" x2="${k.x}" y2="${base+14}" stroke="${k.c}" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
      <text x="${k.x}" y="14" fill="${k.c}" font-size="10.5" text-anchor="middle">${k.t}</text>`).join('')}
    <polyline points="${pts.join(' ')}" fill="none" stroke="#8fd0ff" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="${left}" y="120" fill="#7d8fa3" font-size="10">震后时间 →</text>
    <text x="${right}" y="120" fill="#7d8fa3" font-size="10" text-anchor="end">振幅由小到大</text>
  </svg></div>`;
}

function wvSetPkt(id, a, b, t){
  const el=detailBody.querySelector('#'+id);
  if(!el) return;
  el.setAttribute('cx',(a.x+(b.x-a.x)*t).toFixed(1));
  el.setAttribute('cy',(a.y+(b.y-a.y)*t).toFixed(1));
}
function updateWavePanel(dt){
  if(state.layer!=='wave') return;
  if(reducedMotion) return;
  wvPhase += dt;
  const ring=detailBody.querySelectorAll('#wvRing1,#wvRing2,#wvRing3');
  ring.forEach((el,i)=>{
    const t=((wvPhase*0.55)+i/3)%1;
    el.setAttribute('r',(6+t*26).toFixed(1));
    el.setAttribute('opacity',(0.7*(1-t)).toFixed(2));
  });
  wvSetPkt('wvPktP',WV_SRC,WV_P_END,(wvPhase*0.5)%1);
  wvSetPkt('wvPktPL',WV_SRC,WV_P_L,(wvPhase*0.45+0.2)%1);
  wvSetPkt('wvPktPR',WV_SRC,WV_P_R,(wvPhase*0.45+0.2)%1);
  wvSetPkt('wvPktSL',WV_SRC,WV_S_L,(wvPhase*0.4)%1);
  wvSetPkt('wvPktSR',WV_SRC,WV_S_R,(wvPhase*0.4)%1);
  const tL=(wvPhase*0.5)%1, tR=(wvPhase*0.5+0.3)%1;
  const l=wvArcPoint(-90+(-50)*tL), r=wvArcPoint(-90+(50)*tR);
  const elL=detailBody.querySelector('#wvPktLL'), elR=detailBody.querySelector('#wvPktLR');
  if(elL){elL.setAttribute('cx',l.x.toFixed(1));elL.setAttribute('cy',l.y.toFixed(1));}
  if(elR){elR.setAttribute('cx',r.x.toFixed(1));elR.setAttribute('cy',r.y.toFixed(1));}
}

function switchLayer(name){
  state.layer = name;
  syncOverview();
  document.querySelectorAll('.layer-btn').forEach(b=>
    b.classList.toggle('active', b.dataset.layer===name));
  if(climateGroup) climateGroup.visible = false;
  if(currentGroup) currentGroup.visible = false;
  if(landmarkGroup) landmarkGroup.visible = false;
  if(plateGroup){ plateGroup.visible=false; plateLabelObjs.forEach(L=>L.obj.visible=false); }
  if(quakeGroup){ quakeGroup.visible=false; quakeLabelObjs.forEach(L=>L.obj.visible=false); }
  selectedMarker = -1;
  $('explodeCtl').classList.remove('show');

  if(name==='solar'){
    enterSolarMode();
    renderSolarPanel(-1); openPanel();
    return;
  }
  if(solarSystemGroup&&solarSystemGroup.visible) exitSolarMode();
  if(name==='layer'){
    enterLayerMode();
    $('explodeSlider').value=0;
    $('explodeVal').textContent='0%';
    setExplode(0);
    renderLayerPanel(0); openPanel();
    $('explodeCtl').classList.add('show');
    return;
  }
  if(layerGroup.visible) exitLayerMode();
  if(name==='natural'){ closePanel(); }
  if(name==='climate'){ climateGroup.visible=true; renderClimatePanel(); openPanel(); }
  if(name==='current'){ currentGroup.visible=true; renderCurrentOverview(); openPanel(); }
  if(name==='landmark'){ landmarkGroup.visible=true; renderLandmarkOverview(); openPanel(); }
  if(name==='plate'){ plateGroup.visible=true; plateLabelObjs.forEach(L=>L.obj.visible=true);
    renderPlateOverview(); openPanel(); }
  if(name==='quake'){ quakeGroup.visible=true; quakeLabelObjs.forEach(L=>L.obj.visible=true);
    renderQuakeOverview(); openPanel(); }
  if(name==='wave'){ renderWavePanel(); openPanel(); }
}

/* ============================================================
   UI：3D 拾取与悬浮提示
   ============================================================ */
const tooltip = $('tooltip');
let downX=0, downY=0;
function setPointer(e){
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX-rect.left)/rect.width)*2 - 1;
  pointer.y = -((e.clientY-rect.top)/rect.height)*2 + 1;
}
function showTooltip(e, html){
  tooltip.innerHTML = html;
  tooltip.classList.add('show');
  const x = Math.min(e.clientX+14, window.innerWidth-210);
  const y = Math.min(e.clientY+14, window.innerHeight-70);
  tooltip.style.left = x+'px'; tooltip.style.top = y+'px';
}
function handleHover(e){
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  renderer.domElement.style.cursor = 'grab';
  if(state.layer==='solar'){
    if(sunLayerMode){
      const hit=raycaster.intersectObjects(sunLayerMeshes.map(m=>m.group),true)[0];
      if(hit){let obj=hit.object;
        while(obj&&obj.userData.type!=='sunLayer')obj=obj.parent;
        if(obj){renderer.domElement.style.cursor='pointer';
          showTooltip(e,`<b>${SUN_LAYERS[obj.userData.idx].name}</b><small>点击查看该层</small>`);}
      }else tooltip.classList.remove('show');
      return;
    }
    const bodies=solarPlanetObjs.map(o=>o.body);
    const sun=solarSystemGroup.userData.sun;
    const hit=raycaster.intersectObjects([sun,...bodies,...sunActivityMarkers],true)[0];
    if(hit){
      let obj=hit.object;
      while(obj&&!obj.userData.type)obj=obj.parent;
      if(obj&&obj.userData.type==='solarBody'){
        renderer.domElement.style.cursor='pointer';
        const idx=obj.userData.idx;
        if(idx===-1)showTooltip(e,'<b>太阳</b><small>中心天体 · 点击查看结构与活动</small>');
        else if(idx===100)showTooltip(e,'<b>月球</b><small>地球天然卫星 · 点击查看</small>');
        else{const p=PLANETS[idx];showTooltip(e,`<b>${p.name}</b><small>${p.period} · 点击查看</small>`);}
      }else if(obj&&obj.userData.type==='solarActivity'){
        renderer.domElement.style.cursor='pointer';
        const a=SOLAR_ACTIVITIES[obj.userData.act];
        showTooltip(e,`<b>${a.name}</b><small>${a.layer} · 点击查看</small>`);
      }
    } else tooltip.classList.remove('show');
    return;
  }
  if(state.layer==='landmark'){
    const hit = raycaster.intersectObjects(markerMeshes,false)[0];
    if(hit){
      hoveredMarker = hit.userData.idx;
      const lm = LANDMARKS[hoveredMarker];
      renderer.domElement.style.cursor='pointer';
      showTooltip(e,`<b>${lm.name}</b><small>${lm.city} · ${lm.country} · 点击查看</small>`);
    } else { hoveredMarker=-1; tooltip.classList.remove('show'); }
  } else if(state.layer==='current'){
    const hit = raycaster.intersectObjects(currentMeshes,false)[0];
    if(hit){
      const c = OCEAN_CURRENTS[hit.userData.idx];
      renderer.domElement.style.cursor='pointer';
      showTooltip(e,`<b>${c.name}</b><small>${c.kind==='warm'?'暖流':'寒流'} · ${c.speed} · 点击查看</small>`);
    } else tooltip.classList.remove('show');
  } else if(state.layer==='plate'){
    const hit = raycaster.intersectObjects(plateMeshes,false)[0];
    if(hit){
      const b=PLATE_BOUNDARIES[hit.userData.idx],t=BOUNDARY_TYPE[b.type];
      renderer.domElement.style.cursor='pointer';
      showTooltip(e,`<b>${b.name}</b><small>${t.name} · 点击查看</small>`);
    } else tooltip.classList.remove('show');
  } else if(state.layer==='quake'){
    const hit = raycaster.intersectObjects(quakeMeshes,false)[0];
    if(hit){
      const b=SEISMIC_BELTS[hit.userData.idx];
      renderer.domElement.style.cursor='pointer';
      showTooltip(e,`<b>${b.name}</b><small>点击查看详情</small>`);
    } else tooltip.classList.remove('show');
  } else tooltip.classList.remove('show');
}
function handlePick(e){
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  if(state.layer==='solar'){
    if(sunLayerMode){
      const hit=raycaster.intersectObjects(sunLayerMeshes.map(m=>m.group),true)[0];
      if(hit){let obj=hit.object;
        while(obj&&obj.userData.type!=='sunLayer')obj=obj.parent;
        if(obj)renderSunLayerDetail(obj.userData.idx);
      }
      return;
    }
    const bodies=solarPlanetObjs.map(o=>o.body);
    const sun=solarSystemGroup.userData.sun;
    const hit=raycaster.intersectObjects([sun,...bodies,...sunActivityMarkers],true)[0];
    if(hit){
      let obj=hit.object;
      while(obj&&!obj.userData.type)obj=obj.parent;
      if(obj&&obj.userData.type==='solarBody'){
        const idx=obj.userData.idx;
        if(idx===100)renderSolarPanel(100);
        else renderSolarPanel(idx);
        openPanel();
      }else if(obj&&obj.userData.type==='solarActivity'){
        renderSolarPanel(111);openPanel();
        setTimeout(()=>renderActDetail(obj.userData.act),0);
      }
    }
    return;
  }
  if(state.layer==='landmark'){
    const hit = raycaster.intersectObjects(markerMeshes,false)[0];
    if(hit){
      const idx = hit.userData.idx;
      selectedMarker = idx;
      const lm = LANDMARKS[idx];
      flyTo(lm.lat,lm.lon); renderLandmarkDetail(idx); openPanel();
    }
  } else if(state.layer==='current'){
    const hit = raycaster.intersectObjects(currentMeshes,false)[0];
    if(hit){
      const idx = hit.userData.idx, c=OCEAN_CURRENTS[idx];
      const mid = c.path[Math.floor(c.path.length/2)];
      flyTo(mid[0],mid[1]); renderCurrentDetail(idx); openPanel();
    }
  } else if(state.layer==='plate'){
    const hit = raycaster.intersectObjects(plateMeshes,false)[0];
    if(hit){
      const idx=hit.userData.idx,b=PLATE_BOUNDARIES[idx];
      const mid=b.path[Math.floor(b.path.length/2)];
      flyTo(mid[0],mid[1]); renderBoundaryDetail(idx); openPanel();
    }
  } else if(state.layer==='quake'){
    const hit = raycaster.intersectObjects(quakeMeshes,false)[0];
    if(hit){
      const idx=hit.userData.idx,b=SEISMIC_BELTS[idx];
      const mid=b.paths[0][Math.floor(b.paths[0].length/2)];
      flyTo(mid[0],mid[1]); renderQuakeDetail(idx); openPanel();
    }
  }
}

  orbit:'<circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4.5"/>',
  cloud:'<path d="M17.5 18a4.5 4.5 0 0 0 .5-9 6 6 0 0 0-11.5 1.5A4 4 0 0 0 7 18z"/>',
  climate:'<path d="M3 14h4l2-3 3 5 2-4 2 2h5"/><path d="M4 19h16"/>',
  water:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  mountain:'<path d="m3 20 6-11 4 6 3-4 5 9z"/><circle cx="17" cy="6" r="2"/>',
  leaf:'<path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"/><path d="M5 19c3-5 6-8 10-10"/>',
  people:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5a3 3 0 0 1 0 5.8M18 20a5.5 5.5 0 0 0-3-4.9"/>',
  industry:'<path d="M3 21V10l6 3V10l6 3V7l6 3v11z"/><path d="M7 17h.01M12 17h.01M17 17h.01"/>',
  disaster:'<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5h.01"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/>',
  china:'<path d="M3 18h6v-5h6V8h6"/><path d="M3 21h18"/>',
  method:'<path d="M8 7h13M8 12h13M8 17h13"/><circle cx="4" cy="7" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="17" r="1.2"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/>'
};
function kbSvg(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+(KB_ICONS[name]||KB_ICONS.globe)+'</svg>';}
function kbCard(it){
  const pts=(it.p&&it.p.length)?'<div class="kb-points"><ul>'+it.p.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>':'';
  return '<div class="kb-card"><h3>'+it.t+'</h3><div class="kb-d">'+it.d+'</div>'+pts+'</div>';
}
function renderKbCats(){
  $('kbCats').innerHTML=GEO_KB.map((c,i)=>
    '<button class="kb-cat'+(i===kbActiveCat?' active':'')+'" data-kbcat="'+i+'">'+kbSvg(c.icon)+
    '<span>'+c.cat+'</span><span class="cnt">'+c.items.length+'</span></button>').join('');
}
function renderKbContent(){
  const q=kbQuery.trim().toLowerCase();
  let html='';
  if(q){
    const groups=[];
    GEO_KB.forEach(c=>{
      const hits=c.items.filter(it=>it.t.toLowerCase().includes(q)||it.d.toLowerCase().includes(q)||
        it.p.some(x=>x.toLowerCase().includes(q)));
      if(hits.length) groups.push({cat:c.cat,items:hits});
    });
    if(!groups.length) html='<div class="kb-empty">未找到与“'+kbQuery+'”相关的知识点</div>';
    else groups.forEach(g=>{html+='<div class="kb-grid"><div class="kb-sec-label">'+g.cat+'</div>'+
      g.items.map(kbCard).join('')+'</div>';});
  } else {
    html='<div class="kb-grid">'+GEO_KB[kbActiveCat].items.map(kbCard).join('')+'</div>';
  }
  $('kbContent').innerHTML=html;
}
function openKb(){
  kbOpen=true;
  $('kbOverlay').classList.add('open');
  $('kbOverlay').setAttribute('aria-hidden','false');
  renderKbCats();renderKbContent();
}
function closeKb(){
  kbOpen=false;
  $('kbOverlay').classList.remove('open');
  $('kbOverlay').setAttribute('aria-hidden','true');
}

/* ============================================================
   UI：事件绑定
   ============================================================ */
function bindAll(){
  document.querySelectorAll('.layer-btn').forEach(b=>
    b.addEventListener('click',()=>switchLayer(b.dataset.layer)));

  renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;});
  renderer.domElement.addEventListener('pointermove',handleHover);
  renderer.domElement.addEventListener('pointerup',e=>{
    if(Math.hypot(e.clientX-downX,e.clientY-downY)>7) return;
    handlePick(e);
  });

  detailBody.addEventListener('click',e=>{
    const cm = e.target.closest('[data-cm]');
    if(cm){ state.climateMode=cm.dataset.cm; renderClimatePanel(); rebuildClimate(); return; }
    const fb = e.target.closest('[data-act="flybelt"]');
    if(fb){ flyTo(parseFloat(fb.dataset.lat), isMobile?10:0); return; }
    const ci = e.target.closest('[data-current]');
    if(ci){ const i=+ci.dataset.current, c=OCEAN_CURRENTS[i];
      const mid=c.path[Math.floor(c.path.length/2)];
      flyTo(mid[0],mid[1]); renderCurrentDetail(i); return; }
    const li = e.target.closest('[data-landmark]');
    if(li){ const i=+li.dataset.landmark, lm=LANDMARKS[i];
      selectedMarker=i; flyTo(lm.lat,lm.lon); renderLandmarkDetail(i); return; }
    const plb = e.target.closest('[data-plate]');
    if(plb){ const i=+plb.dataset.plate,p=TECTONIC_PLATES[i];
      flyTo(p.label[0],p.label[1]); renderPlateDetail(i); return; }
    const pbd = e.target.closest('[data-plateboundary]');
    if(pbd){ const i=+pbd.dataset.plateboundary,b=PLATE_BOUNDARIES[i];
      const mid=b.path[Math.floor(b.path.length/2)];
      flyTo(mid[0],mid[1]); renderBoundaryDetail(i); return; }
    const qkb = e.target.closest('[data-quake]');
    if(qkb){ const i=+qkb.dataset.quake,b=SEISMIC_BELTS[i];
      const mid=b.paths[0][Math.floor(b.paths[0].length/2)];
      flyTo(mid[0],mid[1]); renderQuakeDetail(i); return; }
    const lr = e.target.closest('[data-layerrow]');
    if(lr){ renderLayerPanel(+lr.dataset.layerrow); return; }
    const cc = e.target.closest('[data-city]');
    if(cc){ const i=+cc.dataset.city, c=CITY_LABELS[i];
      flyTo(c.lat,c.lon); renderCityClimate(i); return; }
    const st = e.target.closest('[data-term]');
    if(st){ state.dayOfYear=+st.dataset.term; updateSunReadout(); return; }
    const si = e.target.closest('[data-search]');
    if(si){ searchPool[+si.dataset.search].act(); searchResults.classList.remove('open'); return; }
    const pl = e.target.closest('[data-planet]');
    if(pl){ renderSolarPanel(+pl.dataset.planet); return; }
    const sv2 = e.target.closest('[data-solarview]');
    if(sv2){ renderSolarPanel(+sv2.dataset.solarview); return; }
    const sl2 = e.target.closest('[data-sunlayer]');
    if(sl2){ renderSunLayerDetail(+sl2.dataset.sunlayer); return; }
    const ad2 = e.target.closest('[data-actdetail]');
    if(ad2){ renderActDetail(+ad2.dataset.actdetail); return; }
    if(e.target.closest('#eclipseDemo')){
      demoEclipse(solarCurrentIdx===120?'solar':'lunar');return;
    }
    if(e.target.closest('#solarPlay')){
      solarPaused=!solarPaused;
      renderSolarPanel(solarCurrentIdx);
      return;
    }
  });
  /* 日期滑块（动态生成，input 事件委托 + rAF 节流） */
  let sunRaf=0;
  detailBody.addEventListener('input',e=>{
    if(e.target.id==='solarSpeedSlider'){
      solarSpeed=+e.target.value;
      const sv=detailBody.querySelector('.solar-speed .sv');
      if(sv)sv.textContent=solarSpeed.toFixed(1)+'×';
      return;
    }
    if(e.target.id==='sunExplodeSlider'){
      const v=+e.target.value/100;
      setSunExplode(v);
      const lbl=e.target.parentElement.querySelector('.sv');
      if(lbl)lbl.textContent=Math.round(v*100)+'%';
      return;
    }
    if(e.target.id!=='sunSlider') return;
    state.dayOfYear=+e.target.value;
    if(sunRaf) return;
    sunRaf=requestAnimationFrame(()=>{sunRaf=0; updateSunReadout();});
  });

  /* 缩放与复位：导航式平滑过渡，可被手动拖动立即打断 */
  function tweenRadius(nd){
    const d=camera.position.length();
    if(Math.abs(nd-d)<0.001)return;
    if(reducedMotion||!window.gsap){camera.position.setLength(nd);return;}
    const proxy={r:d};
    gsap.killTweensOf(camera.position);
    gsap.to(proxy,{r:nd,duration:0.42,ease:'power2.out',
      onUpdate(){camera.position.setLength(proxy.r);}});
  }
  function dolly(f){
    const nd=THREE.MathUtils.clamp(camera.position.length()*f,controls.minDistance,controls.maxDistance);
    tweenRadius(nd);
  }
  $('zoomIn').addEventListener('click',()=>dolly(0.78));
  $('zoomOut').addEventListener('click',()=>dolly(1.28));
  $('resetView').addEventListener('click',()=>{
    state.flying=true; controls.enabled=false;
    if(window.gsap&&!reducedMotion){
      gsap.killTweensOf(camera.position);
      gsap.killTweensOf(controls.target);
      gsap.timeline({onComplete(){state.flying=false;controls.enabled=true;}})
        .to(controls.target,{x:0,y:0,z:0,duration:1.05,ease:CAM_EASE},0)
        .to(camera.position,{x:DEFAULT_CAMERA.x,y:DEFAULT_CAMERA.y,z:DEFAULT_CAMERA.z,duration:1.05,ease:CAM_EASE},0);
    } else { camera.position.copy(DEFAULT_CAMERA); state.flying=false; controls.enabled=true; }
  });

  /* 双击/双击屏幕快速放大，键盘快捷键便于桌面操作 */
  renderer.domElement.addEventListener('dblclick',()=>dolly(0.72));
  document.addEventListener('keydown',e=>{
    const tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();
    if(['input','textarea'].includes(tag)||document.activeElement?.isContentEditable)return;
    if(e.key==='+'||e.key==='=')dolly(0.78);
    else if(e.key==='-')dolly(1.28);
    else if(e.key==='0'||e.key==='r'||e.key==='R')$('resetView').click();
  });

  /* 自动旋转 */
  $('autoRotateBtn').addEventListener('click',function(){
    controls.autoRotate = !controls.autoRotate;
    this.classList.toggle('active',controls.autoRotate);
    toast(controls.autoRotate?'已开启自动旋转':'已关闭自动旋转');
  });

  /* 地球概况 */
  $('factsBtn').addEventListener('click',()=>{
    if(state.layer==='layer') switchLayer('natural');
    renderFacts(); openPanel();
  });

  /* 太阳直射与四季 */
  $('sunBtn').addEventListener('click',()=>{
    if(state.layer==='layer') switchLayer('natural');
    renderSunPanel(); openPanel();
  });

  $('detailClose').addEventListener('click',closePanel);

  /* 圈层拆解滑块 */
  const slider=$('explodeSlider');
  slider.addEventListener('input',()=>{
    const v=+slider.value/100;
    setExplode(v);
    $('explodeVal').textContent=slider.value+'%';
    slider.style.background=`linear-gradient(to right,var(--teal) 0%,var(--teal) ${slider.value}%,rgba(132,172,206,.2) ${slider.value}%)`;
  });

  /* 地理知识库 */
  $('kbBtn').addEventListener('click',openKb);
  $('kbClose').addEventListener('click',closeKb);
  $('kbCats').addEventListener('click',e=>{
    const b=e.target.closest('[data-kbcat]');
    if(!b) return;
    kbActiveCat=+b.dataset.kbcat;kbQuery='';$('kbSearch').value='';
    renderKbCats();renderKbContent();
    $('kbContent').scrollTop=0;
  });
  $('kbContent').addEventListener('click',e=>{
    const card=e.target.closest('.kb-card');
    if(card) card.classList.toggle('open');
  });
  $('kbSearch').addEventListener('input',e=>{
    kbQuery=e.target.value;renderKbContent();
  });
  /* 设置：滑动/缩放灵敏度无极调节 */
  const setModal=$('settingsModal');
  $('settingsBtn').addEventListener('click',()=>setModal.classList.add('open'));
  $('setClose').addEventListener('click',()=>setModal.classList.remove('open'));
  setModal.addEventListener('click',e=>{ if(e.target===setModal) setModal.classList.remove('open'); });

  const qualityBtns=document.querySelectorAll('.quality-opt');
  const syncQualityUI=()=>qualityBtns.forEach(btn=>
    btn.classList.toggle('active',btn.dataset.quality===qualityMode));
  qualityBtns.forEach(btn=>btn.addEventListener('click',()=>{
    qualityMode=btn.dataset.quality;
    try{localStorage.setItem('geo_quality',qualityMode);}catch(e){}
    applyRenderQuality();syncQualityUI();
    toast(qualityMode==='hd2k'?'已切换到 2K 高清模式':'已切换到均衡模式');
  }));
  syncQualityUI();

  const rotS=$('rotSens'), zoomS=$('zoomSens');
  const paintFill=el=>el.style.setProperty('--fill',((el.value-el.min)/(el.max-el.min)*100)+'%');
  const syncSens=()=>{
    baseRotSpeed=+rotS.value; baseZoomSpeed=+zoomS.value;
    applySens();
    $('rotVal').textContent=(+rotS.value).toFixed(2);
    $('zoomVal').textContent=(+zoomS.value).toFixed(2);
    paintFill(rotS);paintFill(zoomS);
    try{localStorage.setItem('geo_sens',JSON.stringify({r:+rotS.value,z:+zoomS.value}));}catch(e){}
  };
  rotS.addEventListener('input',syncSens);
  zoomS.addEventListener('input',syncSens);
  $('setReset').addEventListener('click',()=>{
    rotS.value=DEFAULT_SENS.r;zoomS.value=DEFAULT_SENS.z;
    qualityMode=isMobile?'balanced':'hd2k';
    try{localStorage.setItem('geo_quality',qualityMode);}catch(e){}
    syncQualityUI();applyRenderQuality();syncSens();
  });
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem('geo_sens')||'null');}catch(e){}
  if(saved&&typeof saved.r==='number'&&typeof saved.z==='number'){rotS.value=saved.r;zoomS.value=saved.z;}
  syncSens();

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(setModal.classList.contains('open')) setModal.classList.remove('open');
      else if(kbOpen) closeKb();
    }
  });
}

/* ============================================================
   启动
   ============================================================ */
async function init(){
  initRenderer(); initLights(); initStars();
  let tex;
  try{ tex = await loadAll(); }
  catch(err){ $('loaderSub').textContent='纹理加载失败，请检查网络连接后刷新页面'; return; }
  tex.color.colorSpace = THREE.SRGBColorSpace;
  tex.clouds.colorSpace = THREE.SRGBColorSpace;
  initEarth(tex);
  initLabelRenderer();
  createPlaceLabels();
  createClimateLayer(); createCurrentLayer();
  createLandmarkLayer(); createLayerGroup();
  createPlateLayer(); createQuakeLayer();
  createSolarSystem();
  createSunLayerGroup();
  createSolarMarker();
  updateSun(state.dayOfYear);
  setupOverview();
  setupAdjustFocus();
  renderSunOverview();
  syncOverview();
  bindAll();
  if(!reducedMotion && window.gsap){
    camera.position.set(0,1.6,4.4);
    gsap.to(camera.position,{x:DEFAULT_CAMERA.x,y:DEFAULT_CAMERA.y,z:DEFAULT_CAMERA.z,duration:1.8,ease:'expo.out'});
  }
  animate();
  setTimeout(()=>$('loader').classList.add('done'),500);
}
init();

</script>
</body>
</html>
